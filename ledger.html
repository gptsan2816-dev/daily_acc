<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src https://api.github.com; base-uri 'none'; form-action 'none'"><title>모아 | 가계부</title><style>*{box-sizing:border-box} :root{--blue:#245bea;--ink:#162440;--muted:#65738c;--line:#e2e8f2;--bg:#f4f7fc}body{margin:0;font:16px/1.6 system-ui,-apple-system,'Malgun Gothic',sans-serif;background:var(--bg);color:var(--ink)}button,input,select{font:inherit}button,a,input,select{ -webkit-tap-highlight-color:transparent}button{border:1px solid var(--line);padding:11px 17px;border-radius:10px;background:white;color:var(--ink);font-weight:650;cursor:pointer}button:hover{background:#edf3ff}button.primary{background:var(--blue);border-color:var(--blue);color:white}button.primary:hover{background:#1749cb}button:disabled{opacity:.5;cursor:wait}input,select{width:100%;border:1px solid #cfd9e9;border-radius:9px;padding:11px 13px;background:white;color:var(--ink);min-width:0}label{display:block;font-size:14px;font-weight:650}label input,label select{margin-top:7px}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid #7aa8ff;outline-offset:3px}a{color:var(--blue)}h1,h2,p{margin-top:0}h1{font-size:30px;letter-spacing:-1px;line-height:1.35;margin-bottom:10px}h2{font-size:18px;margin-bottom:18px}.muted{font-size:14px;color:var(--muted)}.brand{font-size:25px;font-weight:850;letter-spacing:-1px;display:flex;gap:10px;align-items:center}.mark{background:var(--blue);color:white;border-radius:10px;padding:1px 11px;letter-spacing:-3px}.eyebrow{font-size:13px;font-weight:750;letter-spacing:2px;color:var(--blue);margin-bottom:15px}.panel{background:white;border:1px solid var(--line);border-radius:18px;padding:26px}.fields{display:grid;gap:18px}.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}.actions{display:flex;gap:10px;flex-wrap:wrap}.notice{font-size:14px;padding:13px 16px;border:1px solid #c9dcff;background:#eef4ff;color:#234b92;border-radius:10px;margin-bottom:20px;white-space:pre-line}.notice:empty{display:none}.notice.error{color:#a13333;background:#fff1f1;border-color:#f0caca}small{display:block;font-size:13px;color:var(--muted)}[hidden]{display:none!important}.connect-shell{min-height:100vh;display:grid;grid-template-columns:minmax(320px,.85fr) minmax(500px,1.15fr)}.intro{background:#173fa9;color:white;padding:48px 12%;display:flex;flex-direction:column;justify-content:space-between;gap:65px}.intro .mark{background:white;color:#245bea}.intro h1{font-size:43px;line-height:1.35;letter-spacing:-2px}.intro p{color:#cbdcff;max-width:350px}.steps{padding:0;list-style:none;display:grid;gap:25px}.steps li{display:flex;align-items:center;gap:16px}.steps b{border:1px solid #6b8cda;border-radius:50%;width:34px;height:34px;display:grid;place-items:center;font-size:14px}.steps span{font-size:15px}.intro footer{font-size:13px;color:#bdd0ff}.connect-main{padding:48px 9%;display:flex;align-items:center;justify-content:center}.connect-card{max-width:540px;width:100%}.connect-card .primary{flex:1}.connect-card details{border-top:1px solid var(--line);padding-top:18px;margin-top:26px;font-size:14px}.connect-card summary{cursor:pointer;font-weight:650}.help{font-size:14px;color:var(--muted);margin:20px 0}.app-header{height:auto;background:white;border-bottom:1px solid var(--line);padding:20px 32px;display:flex;justify-content:space-between;gap:20px;align-items:center}.header-actions{display:flex;align-items:center;gap:12px}.badge{font-size:13px;background:#edf3ff;color:#2654b6;border-radius:30px;padding:6px 13px}.app-shell{max-width:1260px;margin:auto;padding:36px 30px 50px}.topline{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:26px}.month-nav{display:flex;align-items:center;gap:8px}.month-nav input{width:170px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-bottom:26px}.summary-card{border:1px solid var(--line);border-radius:16px;background:white;padding:23px 25px}.summary-card span{font-size:14px;color:var(--muted)}.summary-card strong{font-size:31px;display:block;margin-top:10px;letter-spacing:-.8px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}.summary-card.total{background:var(--blue);border-color:var(--blue);color:white}.summary-card.total span{color:#e0eaff}.income{color:#245bea}.expense{color:#bc4951}.workspace{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:24px}.side,.main-column{display:grid;gap:24px;align-content:start}.sectionhead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.sectionhead h2{margin:0}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;font-size:14px}th{color:var(--muted);font-weight:550;text-align:left;background:#f7f9fc}td,th{padding:15px 10px;border-bottom:1px solid var(--line)}td.money{text-align:right;white-space:nowrap;font-weight:750}td.note{overflow-wrap:anywhere;min-width:130px}td button{padding:4px 7px;font-size:13px}.empty{padding:50px 12px;text-align:center;color:var(--muted);font-size:14px}.empty strong{display:block;color:var(--ink);font-size:17px;margin-bottom:8px}.barrow{margin:18px 0;font-size:14px}.barlabel{display:flex;justify-content:space-between;gap:12px}.bar{height:7px;background:#eaf0fa;border-radius:8px;margin-top:8px;overflow:hidden}.bar i{height:100%;display:block;background:var(--blue);border-radius:8px}.connection-meta{overflow-wrap:anywhere;font-size:14px}.app-footer{margin-top:24px;font-size:13px;color:var(--muted)}fieldset{border:0;margin:0;padding:0;min-width:0}#entry .fields{gap:15px}#entry .primary{width:100%}.sync-actions{margin-bottom:20px}.type-hint{background:#f3f6fd;border-radius:8px;padding:12px;font-size:13px;color:var(--muted)}@media(max-width:1050px){.intro{padding:40px 9%}.intro h1{font-size:35px}.connect-main{padding:40px 7%}.workspace{grid-template-columns:minmax(0,1fr) 310px}.summary-card strong{font-size:26px}}@media(max-width:800px){.connect-shell{grid-template-columns:1fr}.intro{padding:24px;gap:22px}.intro h1{font-size:28px;margin:0}.intro p,.steps,.intro footer{display:none}.connect-main{padding:32px 22px}.workspace{grid-template-columns:1fr}.side{grid-row:1}.side .panel:last-child{display:none}.app-header{padding:17px 20px;flex-wrap:wrap}.app-shell{padding:26px 18px}.topline{flex-wrap:wrap}.cards{gap:10px}.summary-card{padding:18px 14px}.summary-card strong{font-size:23px}}@media(max-width:480px){.cards{grid-template-columns:1fr}.summary-card{display:flex;justify-content:space-between;align-items:center}.summary-card strong{margin:0}.panel{padding:20px 16px}.header-actions{flex-wrap:wrap}.badge{display:none}.two{gap:12px}h1{font-size:26px}}
</style></head><body><header class="app-header"><div class="brand"><span class="mark" aria-hidden="true">m</span>모아</div><div class="header-actions"><span class="badge" id="status">연결 확인 중</span><button id="disconnect">연결 해제</button></div></header><main class="app-shell" id="ledger-app" hidden><div class="topline"><div><div class="eyebrow">MY FINANCIAL OVERVIEW</div><h1>나의 가계부</h1><div class="muted">이번 달의 기록이 다음 달의 기준이 됩니다.</div></div><div class="month-nav"><button id="prev" aria-label="이전 달">‹</button><label><span class="muted">조회 월</span><input id="month" type="month" aria-label="조회 월"></label><button id="next" aria-label="다음 달">›</button></div></div><div id="notice" class="notice" role="status" aria-live="polite"></div><div class="cards"><div class="summary-card"><span>이번 달 수입</span><strong class="income" id="income">0원</strong></div><div class="summary-card"><span>이번 달 지출</span><strong id="expense">0원</strong></div><div class="summary-card total"><span>수입 − 지출</span><strong id="balance">0원</strong></div></div><div class="workspace"><div class="main-column"><section class="panel"><div class="sectionhead"><h2>거래 내역 <span id="count" class="muted"></span></h2><button id="backup">JSON 백업</button></div><div class="actions sync-actions"><button id="save" class="primary">GitHub에 저장</button><button id="reload">최신 내역 불러오기</button></div><div class="table-wrap"><table><thead><tr><th>날짜</th><th>분류 · 내용</th><th style="text-align:right">금액</th><th>관리</th></tr></thead><tbody id="rows"></tbody></table></div><div id="empty" class="empty"><strong>아직 기록이 없어요</strong>첫 수입이나 지출을 추가해 보세요.</div></section><section class="panel"><h2>분류별 지출</h2><div id="categories" class="muted"></div></section></div><aside class="side"><section class="panel"><h2 id="formtitle">내역 추가</h2><form id="entry"><fieldset id="entryfields"><div class="fields"><div class="two"><label>구분<select id="type"><option value="expense">지출</option><option value="income">수입</option></select></label><label>날짜<input id="date" type="date" required></label></div><label>금액 (원)<input id="amount" type="number" min="1" max="1000000000000" step="1" placeholder="0" inputmode="numeric" required></label><label>분류<select id="category"></select></label><label>내용<input id="memo" maxlength="200" placeholder="예: 점심 식사" required></label><button id="add" class="primary" type="submit">내역 추가</button><button id="cancel" type="button" hidden>수정 취소</button></div></fieldset></form></section><section class="panel"><h2>연결된 저장소</h2><div id="repo-label" class="connection-meta"></div><div id="path-label" class="muted connection-meta"></div><p class="type-hint" style="margin-top:18px;margin-bottom:0">입력한 내역은 ‘GitHub에 저장’을 눌러야 보관됩니다. JSON 백업은 전체 기간을 포함합니다.</p></section></aside></div><footer class="app-footer">MOA · KRW 기준 · 삭제한 내역도 GitHub의 이전 커밋에는 남을 수 있습니다.</footer></main><script>'use strict';const $=id=>document.getElementById(id);const SESSION='moa.github.session.v1';const won=n=>new Intl.NumberFormat('ko-KR').format(n)+'원';function notify(m,error=false){$('notice').textContent=m;$('notice').classList.toggle('error',error)}let busy=false;function lock(value){busy=value;document.querySelectorAll('button,fieldset').forEach(e=>e.disabled=value)}async function run(fn){if(busy)return;lock(true);try{await fn()}catch(e){notify(e.message,true)}finally{lock(false)}}
function validData(obj){if(!obj||obj.version!==1||obj.currency!=='KRW'||!Array.isArray(obj.transactions))throw Error('ledger.json 형식이 맞지 않습니다. version: 1, currency: KRW, transactions 배열이 필요합니다.');const ids=new Set();for(const t of obj.transactions){if(!t||typeof t.id!=='string'||!t.id||ids.has(t.id)||!['income','expense'].includes(t.type)||!Number.isSafeInteger(t.amount)||t.amount<=0||t.amount>1e12||typeof t.date!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(t.date)||!Number.isFinite(Date.parse(t.date))||new Date(t.date).toISOString().slice(0,10)!==t.date||typeof t.category!=='string'||!t.category||t.category.length>100||typeof t.memo!=='string'||t.memo.length>200)throw Error('지원하지 않는 거래 내역이 있습니다. 원본은 변경하지 않았습니다.');ids.add(t.id)}if(obj.transactions.reduce((s,t)=>s+t.amount,0)>Number.MAX_SAFE_INTEGER)throw Error('거래 합계가 지원 범위를 초과합니다.');return obj}
function config(){const c={};for(const id of ['owner','repo','branch','path','token'])c[id]=$(id).value.trim();if(Object.values(c).some(v=>!v))throw Error('GitHub 연결 정보를 모두 입력하세요.');if(!/^[\w.-]+$/.test(c.owner)||!/^[\w.-]+$/.test(c.repo)||!c.path.endsWith('.json')||c.path.split('/').some(p=>!p||p==='.'||p==='..'))throw Error('아이디, 저장소 이름과 JSON 파일 경로를 확인하세요.');return c}
const base=c=>`/repos/${encodeURIComponent(c.owner)}/${encodeURIComponent(c.repo)}`;
const file=c=>base(c)+'/contents/'+c.path.split('/').map(encodeURIComponent).join('/');
async function api(c,url,method='GET',body){let response;try{response=await fetch('https://api.github.com'+url,{method,headers:{Accept:'application/vnd.github+json',Authorization:'Bearer '+c.token,'X-GitHub-Api-Version':'2026-03-10',...(body?{'Content-Type':'application/json'}:{})},body:body?JSON.stringify(body):undefined,cache:'no-store',credentials:'omit',redirect:'error',signal:AbortSignal.timeout(25000)})}catch(e){throw Error(method==='PUT'?'저장 결과를 확인하지 못했습니다. 재저장 전에 백업하고 최신 내역을 불러와 확인하세요.':'연결할 수 없습니다. 네트워크를 확인하고 다시 시도하세요.')}if(!response.ok){const msg={401:'토큰이 유효하지 않거나 만료되었습니다.',403:'접근 권한 또는 API 사용 한도를 확인하세요. Contents: Read and write 권한이 필요합니다.',404:'저장소·브랜치·파일을 찾을 수 없거나 접근 권한이 없습니다. 연결 정보와 토큰의 저장소 선택을 확인하세요.',409:'다른 변경과 충돌했습니다. 현재 내역을 백업하고 최신 데이터를 불러오세요.',422:'저장이 거부되었습니다. 파일 버전, 브랜치 보호 규칙과 토큰 권한을 확인하세요.'};const error=Error(msg[response.status]||`GitHub 요청에 실패했습니다 (${response.status}).`);error.status=response.status;throw error}return response.json()}
async function privateRepo(c){const r=await api(c,base(c));if(r.private!==true)throw Error('가계부 보호를 위해 비공개 저장소만 연결할 수 있습니다.')}
const remote=c=>api(c,file(c)+'?ref='+encodeURIComponent(c.branch));
function decode(r){if(r.type!=='file'||r.encoding!=='base64'||!r.sha||r.size>900000)throw Error('900KB 이하의 JSON 파일만 지원합니다. 파일 크기와 경로를 확인하세요.');try{return validData(JSON.parse(new TextDecoder('utf-8',{fatal:true}).decode(Uint8Array.from(atob(r.content.replace(/\s/g,'')),ch=>ch.charCodeAt(0)))))}catch(e){throw Error('데이터를 불러오지 못했습니다. '+e.message)}}
function encode(obj){const bytes=new TextEncoder().encode(JSON.stringify(obj,null,2)+'\n');if(bytes.length>900000)throw Error('데이터가 900KB를 넘습니다. 백업 후 기간별 저장소를 사용하세요.');let s='';for(let i=0;i<bytes.length;i+=8192)s+=String.fromCharCode(...bytes.subarray(i,i+8192));return btoa(s)}
async function checkBranch(c){try{await api(c,base(c)+'/branches/'+encodeURIComponent(c.branch))}catch(e){if(e.status===404||e.status===409)throw Error('브랜치를 확인할 수 없습니다. 브랜치 이름을 확인하고, 빈 저장소라면 GitHub에서 README 파일을 먼저 추가하세요.');throw e}}
async function existingFile(c){try{return await remote(c)}catch(e){if(e.status===404)return null;throw e}}

const choices={expense:['식비','카페·간식','교통','쇼핑','주거·통신','건강','문화·여가','교육','기타'],income:['급여','용돈','부수입','이자','기타']};let data={version:1,currency:'KRW',transactions:[]},connection=null,sha=null,dirty=false,editing=null,ready=false;
const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};$('month').value=today().slice(0,7);$('date').value=today();
function controls(){$('save').disabled=busy||!ready||!dirty;$('entryfields').disabled=busy||!ready;$('backup').disabled=!ready;$('reload').disabled=busy;document.querySelectorAll('#rows button').forEach(b=>b.disabled=busy);$('status').textContent=busy?'처리 중':!ready?'연결 확인 필요':dirty?'저장하지 않은 변경':'GitHub 연결됨'}
lock=function(v){busy=v;document.querySelectorAll('button').forEach(b=>b.disabled=v);controls()};
function categories(value){$('category').replaceChildren(...choices[$('type').value].map(t=>new Option(t,t)));if(value&&!choices[$('type').value].includes(value))$('category').add(new Option(value,value));if(value)$('category').value=value}
categories();$('type').onchange=()=>categories();
function reset(){editing=null;$('entry').reset();$('date').value=today();categories();$('formtitle').textContent='새로운 내역';$('add').textContent='내역 추가';$('cancel').hidden=true}
function render(){const list=data.transactions.filter(t=>t.date.startsWith($('month').value)).sort((a,b)=>b.date.localeCompare(a.date));const sums={income:0,expense:0};list.forEach(t=>sums[t.type]+=t.amount);$('income').textContent=won(sums.income);$('expense').textContent=won(sums.expense);$('balance').textContent=won(sums.income-sums.expense);$('count').textContent=`${list.length}건`;$('rows').replaceChildren();$('empty').hidden=list.length>0;
for(const t of list){const tr=document.createElement('tr');const date=document.createElement('td');date.textContent=t.date.slice(5);const note=document.createElement('td');note.className='note';const cat=document.createElement('div');cat.className='muted';cat.textContent=t.category;const memo=document.createElement('div');memo.textContent=t.memo;note.append(cat,memo);const amount=document.createElement('td');amount.className='money '+t.type;amount.textContent=(t.type==='income'?'+':'−')+won(t.amount);const actions=document.createElement('td');for(const [label,fn] of [['수정',()=>edit(t)],['삭제',()=>remove(t)]]){const b=document.createElement('button');b.textContent=label;b.setAttribute('aria-label',t.memo+' '+label);b.onclick=fn;actions.append(b)}tr.append(date,note,amount,actions);$('rows').append(tr)}
const groups=Object.create(null);list.filter(t=>t.type==='expense').forEach(t=>groups[t.category]=(groups[t.category]||0)+t.amount);$('categories').replaceChildren();if(!sums.expense)$('categories').textContent='지출을 기록하면 분류별 합계가 표시됩니다.';for(const [name,value] of Object.entries(groups).sort((a,b)=>b[1]-a[1])){const row=document.createElement('div');row.className='barrow';const labels=document.createElement('div');labels.className='barlabel';const a=document.createElement('span'),b=document.createElement('span');a.textContent=name;b.textContent=won(value);labels.append(a,b);const bar=document.createElement('div');bar.className='bar';const fill=document.createElement('i');fill.style.width=(value/sums.expense*100)+'%';bar.append(fill);row.append(labels,bar);$('categories').append(row)}controls()}
function edit(t){editing=t.id;$('type').value=t.type;categories(t.category);$('date').value=t.date;$('amount').value=t.amount;$('memo').value=t.memo;$('formtitle').textContent='내역 수정';$('add').textContent='수정 완료';$('cancel').hidden=false;$('amount').focus()}
function remove(t){if(!confirm(`“${t.memo}” 내역을 삭제할까요?`))return;data.transactions=data.transactions.filter(x=>x.id!==t.id);dirty=true;if(editing===t.id)reset();render();notify('내역을 삭제했습니다. GitHub에 저장하면 반영됩니다.')}
$('cancel').onclick=reset;$('month').onchange=render;
$('entry').onsubmit=e=>{e.preventDefault();if(busy||!ready)return;const amount=Number($('amount').value);if(!Number.isSafeInteger(amount)||amount<=0||amount>1e12)return notify('금액은 1원부터 1조 원까지 정수로 입력하세요.',true);const memo=$('memo').value.trim();if(!memo)return notify('내용을 입력하세요.',true);const old=data.transactions.find(t=>t.id===editing);const t={...old,id:editing||crypto.randomUUID(),date:$('date').value,type:$('type').value,amount,category:$('category').value,memo};if(editing)data.transactions=data.transactions.map(x=>x.id===editing?t:x);else data.transactions.push(t);dirty=true;$('month').value=t.date.slice(0,7);reset();render();notify('내역을 반영했습니다. GitHub에 저장 버튼으로 동기화하세요.')};

async function reload(){if(dirty&&!confirm('저장하지 않은 변경을 버리고 최신 데이터를 불러올까요?'))return;await privateRepo(connection);const r=await remote(connection);const next=decode(r);data=next;sha=r.sha;dirty=false;ready=true;reset();render();notify('최신 내역을 불러왔습니다.')}
$('reload').onclick=()=>run(reload);
$('save').onclick=()=>run(async()=>{if(!ready||!dirty)return;await privateRepo(connection);const r=await remote(connection);if(r.sha!==sha)throw Error('다른 기기에서 변경된 내역이 있습니다. 덮어쓰지 않았습니다. JSON 백업 후 최신 내역을 불러와 변경 내용을 다시 반영하세요.');validData(data);const next={...data,updatedAt:new Date().toISOString()};const r2=await api(connection,file(connection),'PUT',{message:'Update ledger',content:encode(next),sha,branch:connection.branch});if(!r2.content?.sha)throw Error('저장 결과를 확인하지 못했습니다. 백업 후 최신 내역을 불러와 확인하세요.');data=next;sha=r2.content.sha;dirty=false;notify('GitHub에 저장했습니다. '+new Date().toLocaleTimeString('ko-KR'))});
$('backup').onclick=()=>{const u=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=u;a.download='ledger-backup-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};
$('disconnect').onclick=()=>{if(dirty&&!confirm('저장하지 않은 변경을 버리고 연결을 해제할까요?'))return;dirty=false;sessionStorage.removeItem(SESSION);connection=null;data={version:1,currency:'KRW',transactions:[]};location.replace('index.html')};
function changeMonth(delta){if(!$('month').value)return;const [y,m]=$('month').value.split('-').map(Number);const d=new Date(y,m-1+delta,1);$('month').value=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');render()}
$('prev').onclick=()=>changeMonth(-1);$('next').onclick=()=>changeMonth(1);
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});
async function init(){try{const c=JSON.parse(sessionStorage.getItem(SESSION)||'null');if(!c||['owner','repo','path','branch','token'].some(k=>typeof c[k]!=='string'||!c[k])){location.replace('index.html');return}connection=c}catch{location.replace('index.html');return}$('ledger-app').hidden=false;$('repo-label').textContent=connection.owner+'/'+connection.repo;$('path-label').textContent=connection.branch+' · '+connection.path;await run(reload)}init();
</script></body></html>
