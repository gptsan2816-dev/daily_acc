<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src https://api.github.com; base-uri 'none'; form-action 'none'"><title>가계부 | GitHub 연결</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#182b4d;font:16px/1.5 system-ui,-apple-system,'Malgun Gothic',sans-serif}header{background:#fff;border-bottom:1px solid #e1e7f0}nav{max-width:1200px;margin:auto;padding:20px 24px;display:flex;justify-content:space-between;align-items:center;gap:18px}.status{display:flex;align-items:center;gap:10px;font-weight:650;font-size:15px}.dot{width:9px;height:9px;border-radius:50%;background:#9aa9bf}.dot.connected{background:#2563eb}.actions{display:flex;gap:10px;flex-wrap:wrap}button{font:inherit;font-size:14px;font-weight:650;border:1px solid #dbe3ef;border-radius:9px;padding:11px 17px;background:#fff;color:#294262;cursor:pointer}button:hover{background:#f0f5ff}button.primary{background:#2563eb;border-color:#2563eb;color:#fff}button.primary:hover{background:#1d4ed8}button:disabled{opacity:.45;cursor:not-allowed}button:focus-visible{outline:3px solid #8ab3ff;outline-offset:3px}main{max-width:1200px;margin:auto;padding:20px 24px}.notice{background:#edf4ff;color:#254b90;border:1px solid #d3e2ff;border-radius:10px;padding:13px 16px;font-size:14px;white-space:pre-line}.notice:empty{display:none}.notice.error{background:#fff1f1;color:#a03333;border-color:#f1cccc}@media(max-width:580px){nav{align-items:flex-start;flex-direction:column;padding:18px 16px}.actions{width:100%}.actions button{flex:1;padding:11px 10px}main{padding:16px}}

.calendar{margin-top:22px;background:#fff;border:1px solid #e0e7f1;border-radius:20px;overflow:hidden;box-shadow:0 8px 32px #1c458008}.calendar-head{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:28px 30px 24px}.calendar-label{font-size:12px;font-weight:750;letter-spacing:2px;color:#7485a0;margin-bottom:6px}.calendar h1{font-size:28px;letter-spacing:-1px;margin:0;line-height:1.3}.calendar-tools{display:flex;gap:8px;align-items:center}.calendar-tools button{height:40px;padding:8px 14px}.calendar-tools .arrow{width:40px;padding:0;font-size:24px;line-height:1}.calendar table{width:100%;border-collapse:collapse;table-layout:fixed}.calendar th{height:44px;border-top:1px solid #eef1f6;border-bottom:1px solid #e7edf5;background:#fafbfe;color:#7b89a0;font-size:13px;font-weight:600}.calendar td{height:100px;padding:8px;border-right:1px solid #eef2f7;border-bottom:1px solid #eef2f7;vertical-align:top}.calendar td:last-child{border-right:0}.calendar tr:last-child td{border-bottom:0}.calendar .day{display:flex;align-items:flex-start;justify-content:flex-start;position:relative;width:100%;height:100%;border:0;border-radius:10px;padding:5px;background:transparent;font-weight:550;color:#34455f}.calendar .day:hover{background:#f2f6ff}.day .number{display:grid;place-items:center;width:33px;height:33px;border-radius:50%;font-size:14px}.calendar .sun .day,.calendar .sun{color:#c26370}.calendar .sat .day,.calendar .sat{color:#4772be}.calendar .outside .day{color:#bac3d1}.calendar .selected .day{background:#eef4ff;box-shadow:inset 0 0 0 1px #d7e5ff}.calendar .selected .number{background:#2563eb;color:white;font-weight:750}.calendar .today:not(.selected) .number{color:#2563eb;background:#eaf1ff;font-weight:750}.today-marker{position:absolute;right:10px;bottom:9px;color:#2563eb;font-size:12px}.calendar-foot{border-top:1px solid #e7edf5;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 30px;font-size:14px;color:#71819a}.calendar-foot strong{font-weight:600;color:#395575}.legend{display:flex;align-items:center;gap:7px;font-size:13px}.legend i{width:7px;height:7px;border-radius:50%;background:#2563eb}@media(max-width:580px){.calendar{margin-top:12px;border-radius:15px}.calendar-head{padding:20px 16px;gap:12px;flex-wrap:wrap}.calendar h1{font-size:24px}.calendar-label{font-size:12px}.calendar td{height:72px;padding:3px}.calendar .day{padding:3px;border-radius:7px}.day .number{width:28px;height:28px;font-size:13px}.today-marker{font-size:10px;right:6px;bottom:4px}.calendar-foot{padding:14px 16px;font-size:13px}.calendar-tools{gap:6px}}
</style></head><body><header><nav aria-label="GitHub 연결 관리"><div class="status" role="status"><span id="dot" class="dot" aria-hidden="true"></span><span id="status">GitHub 연결 확인 중</span></div><div class="actions"><button id="disconnect">연결 해제</button><button id="save" class="primary" disabled>GitHub 저장</button><button id="reload" disabled>불러오기</button></div></nav></header><main><div id="notice" class="notice" role="status" aria-live="polite"></div><section class="calendar" aria-labelledby="calendar-title"><div class="calendar-head"><div><div class="calendar-label">MONTHLY CALENDAR</div><h1 id="calendar-title" aria-live="polite"></h1></div><div class="calendar-tools"><button id="cal-today" type="button">오늘</button><button id="cal-prev" class="arrow" type="button" aria-label="이전 달">‹</button><button id="cal-next" class="arrow" type="button" aria-label="다음 달">›</button></div></div><table aria-labelledby="calendar-title"><thead><tr><th class="sun" scope="col">일</th><th scope="col">월</th><th scope="col">화</th><th scope="col">수</th><th scope="col">목</th><th scope="col">금</th><th class="sat" scope="col">토</th></tr></thead><tbody id="calendar-days"></tbody></table><div class="calendar-foot"><span id="calendar-selection" aria-live="polite"></span><span class="legend"><i aria-hidden="true"></i>오늘</span></div></section></main><script>'use strict';const $=id=>document.getElementById(id);const SESSION='moa.github.session.v1';const won=n=>new Intl.NumberFormat('ko-KR').format(n)+'원';function notify(m,error=false){$('notice').textContent=m;$('notice').classList.toggle('error',error)}let busy=false;function lock(value){busy=value;document.querySelectorAll('button,fieldset').forEach(e=>e.disabled=value)}async function run(fn){if(busy)return;lock(true);try{await fn()}catch(e){notify(e.message,true)}finally{lock(false)}}
function validData(obj){if(!obj||obj.version!==1||obj.currency!=='KRW'||!Array.isArray(obj.transactions))throw Error('ledger.json 형식이 맞지 않습니다. version: 1, currency: KRW, transactions 배열이 필요합니다.');const ids=new Set();for(const t of obj.transactions){if(!t||typeof t.id!=='string'||!t.id||ids.has(t.id)||!['income','expense'].includes(t.type)||!Number.isSafeInteger(t.amount)||t.amount<=0||t.amount>1e12||typeof t.date!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(t.date)||!Number.isFinite(Date.parse(t.date))||new Date(t.date).toISOString().slice(0,10)!==t.date||typeof t.category!=='string'||!t.category||t.category.length>100||typeof t.memo!=='string'||t.memo.length>200)throw Error('지원하지 않는 거래 내역이 있습니다. 원본은 변경하지 않았습니다.');ids.add(t.id)}if(obj.transactions.reduce((s,t)=>s+t.amount,0)>Number.MAX_SAFE_INTEGER)throw Error('거래 합계가 지원 범위를 초과합니다.');return obj}
function config(){const c={};for(const id of ['owner','repo','branch','path','token'])c[id]=$(id).value.trim();if(Object.values(c).some(v=>!v))throw Error('GitHub 연결 정보를 모두 입력하세요.');if(!/^[\w.-]+$/.test(c.owner)||!/^[\w.-]+$/.test(c.repo)||!c.path.endsWith('.json')||c.path.split('/').some(p=>!p||p==='.'||p==='..'))throw Error('아이디, 저장소 이름과 JSON 파일 경로를 확인하세요.');return c}
const base=c=>`/repos/${encodeURIComponent(c.owner)}/${encodeURIComponent(c.repo)}`;
const file=c=>base(c)+'/contents/'+c.path.split('/').map(encodeURIComponent).join('/');
async function api(c,url,method='GET',body){let response;try{response=await fetch('https://api.github.com'+url,{method,headers:{Accept:'application/vnd.github+json',Authorization:'Bearer '+c.token,'X-GitHub-Api-Version':'2026-03-10',...(body?{'Content-Type':'application/json'}:{})},body:body?JSON.stringify(body):undefined,cache:'no-store',credentials:'omit',redirect:'error',signal:AbortSignal.timeout(25000)})}catch(e){throw Error(method==='PUT'?'저장 결과를 확인하지 못했습니다. 재저장 전에 백업하고 최신 내역을 불러와 확인하세요.':'연결할 수 없습니다. 네트워크를 확인하고 다시 시도하세요.')}if(!response.ok){const msg={401:'토큰이 유효하지 않거나 만료되었습니다.',403:'접근 권한 또는 API 사용 한도를 확인하세요. Contents: Read and write 권한이 필요합니다.',404:'저장소·브랜치·파일을 찾을 수 없거나 접근 권한이 없습니다. 연결 정보와 토큰의 저장소 선택을 확인하세요.',409:'다른 변경과 충돌했습니다. 현재 내역을 백업하고 최신 데이터를 불러오세요.',422:'저장이 거부되었습니다. 파일 버전, 브랜치 보호 규칙과 토큰 권한을 확인하세요.'};const error=Error(msg[response.status]||`GitHub 요청에 실패했습니다 (${response.status}).`);error.status=response.status;throw error}return response.json()}
async function privateRepo(c){const r=await api(c,base(c));if(r.private!==true)throw Error('가계부 보호를 위해 비공개 저장소만 연결할 수 있습니다.')}
const remote=c=>api(c,file(c)+'?ref='+encodeURIComponent(c.branch));
function decode(r){if(r.type!=='file'||r.encoding!=='base64'||!r.sha||r.size>900000)throw Error('900KB 이하의 JSON 파일만 지원합니다. 파일 크기와 경로를 확인하세요.');try{return validData(JSON.parse(new TextDecoder('utf-8',{fatal:true}).decode(Uint8Array.from(atob(r.content.replace(/\s/g,'')),ch=>ch.charCodeAt(0)))))}catch(e){throw Error('데이터를 불러오지 못했습니다. '+e.message)}}
function encode(obj){const bytes=new TextEncoder().encode(JSON.stringify(obj,null,2)+'\n');if(bytes.length>900000)throw Error('데이터가 900KB를 넘습니다. 백업 후 기간별 저장소를 사용하세요.');let s='';for(let i=0;i<bytes.length;i+=8192)s+=String.fromCharCode(...bytes.subarray(i,i+8192));return btoa(s)}
async function checkBranch(c){try{await api(c,base(c)+'/branches/'+encodeURIComponent(c.branch))}catch(e){if(e.status===404||e.status===409)throw Error('브랜치를 확인할 수 없습니다. 브랜치 이름을 확인하고, 빈 저장소라면 GitHub에서 README 파일을 먼저 추가하세요.');throw e}}
async function existingFile(c){try{return await remote(c)}catch(e){if(e.status===404)return null;throw e}}


let connection=null,data=null,sha=null,ready=false;
function controls(){$('save').disabled=busy||!ready;$('reload').disabled=busy||!connection;$('disconnect').disabled=busy;$('dot').classList.toggle('connected',ready);$('status').textContent=ready?'GitHub 연결됨':connection?'GitHub 연결 확인 필요':'GitHub 연결 안 됨'}
lock=function(v){busy=v;controls()};
async function loadData(silent=false){await privateRepo(connection);const r=await remote(connection);const next=decode(r);data=next;sha=r.sha;ready=true;if(!silent)notify('GitHub에서 불러왔습니다. '+new Date().toLocaleTimeString('ko-KR'))}
$('reload').onclick=()=>run(()=>loadData());
$('save').onclick=()=>run(async()=>{if(!ready||!data)return;await privateRepo(connection);const current=await remote(connection);if(current.sha!==sha)throw Error('GitHub의 파일이 변경되었습니다. 덮어쓰지 않았습니다. 불러오기를 누른 뒤 다시 저장해 주세요.');validData(data);const result=await api(connection,file(connection),'PUT',{message:'Save ledger',content:encode(data),sha,branch:connection.branch});if(!result.content?.sha)throw Error('저장 결과를 확인하지 못했습니다. 불러오기로 확인해 주세요.');sha=result.content.sha;notify('GitHub에 저장했습니다. '+new Date().toLocaleTimeString('ko-KR'))});
$('disconnect').onclick=()=>{if(busy)return;try{sessionStorage.removeItem(SESSION)}catch{notify('연결 정보를 삭제하지 못했습니다. 탭을 닫아 주세요.',true);return}connection=null;data=null;sha=null;ready=false;controls();location.replace('index.html')};
async function init(){try{const c=JSON.parse(sessionStorage.getItem(SESSION)||'null');if(!c||['owner','repo','path','branch','token'].some(k=>typeof c[k]!=='string'||!c[k])){location.replace('index.html');return}connection=c}catch{location.replace('index.html');return}await run(()=>loadData(true))}init();

const calendarNow=new Date();let calendarMonth=new Date(calendarNow.getFullYear(),calendarNow.getMonth(),1),calendarSelected=calendarKey(calendarNow);
function calendarKey(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function drawCalendar(focusKey){const y=calendarMonth.getFullYear(),m=calendarMonth.getMonth(),todayKey=calendarKey(new Date());$('calendar-title').textContent=y+'년 '+(m+1)+'월';$('calendar-days').replaceChildren();const first=new Date(y,m,1);let focusButton;
for(let row=0;row<6;row++){const tr=document.createElement('tr');for(let col=0;col<7;col++){const d=new Date(y,m,1-first.getDay()+row*7+col),key=calendarKey(d),td=document.createElement('td'),b=document.createElement('button'),n=document.createElement('span');td.className=[col===0?'sun':col===6?'sat':'',d.getMonth()!==m?'outside':'',key===calendarSelected?'selected':'',key===todayKey?'today':''].join(' ');b.type='button';b.className='day';b.setAttribute('aria-label',d.toLocaleDateString('ko-KR',{year:'numeric',month:'long',day:'numeric',weekday:'long'}));b.setAttribute('aria-pressed',String(key===calendarSelected));if(key===todayKey)b.setAttribute('aria-current','date');n.className='number';n.textContent=d.getDate();b.append(n);if(key===todayKey){const marker=document.createElement('span');marker.className='today-marker';marker.textContent='오늘';b.append(marker)}b.onclick=()=>{calendarSelected=key;if(d.getMonth()!==m||d.getFullYear()!==y)calendarMonth=new Date(d.getFullYear(),d.getMonth(),1);drawCalendar(key)};b.onkeydown=e=>{const steps={ArrowLeft:-1,ArrowRight:1,ArrowUp:-7,ArrowDown:7};if(!(e.key in steps))return;e.preventDefault();const target=new Date(d.getFullYear(),d.getMonth(),d.getDate()+steps[e.key]);calendarSelected=calendarKey(target);calendarMonth=new Date(target.getFullYear(),target.getMonth(),1);drawCalendar(calendarSelected)};if(key===focusKey)focusButton=b;td.append(b);tr.append(td)}$('calendar-days').append(tr)}
const parts=calendarSelected.split('-').map(Number);$('calendar-selection').textContent='선택한 날짜 · '+new Date(parts[0],parts[1]-1,parts[2]).toLocaleDateString('ko-KR',{month:'long',day:'numeric',weekday:'long'});if(focusButton)focusButton.focus()}
$('cal-prev').onclick=()=>{calendarMonth=new Date(calendarMonth.getFullYear(),calendarMonth.getMonth()-1,1);drawCalendar()};$('cal-next').onclick=()=>{calendarMonth=new Date(calendarMonth.getFullYear(),calendarMonth.getMonth()+1,1);drawCalendar()};$('cal-today').onclick=()=>{const d=new Date();calendarMonth=new Date(d.getFullYear(),d.getMonth(),1);calendarSelected=calendarKey(d);drawCalendar()};drawCalendar();
</script></body></html>
