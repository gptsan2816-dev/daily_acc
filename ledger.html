span>⛰️</span></label></div><div class="entry-grid"><label class="entry-date-label">날짜<input id="entry-date" type="date" required></label><label class="entry-amount-label">금액 (원)<input id="entry-amount" type="text" maxlength="17" autocomplete="off" inputmode="numeric" placeholder="0" required></label><label>분류<select id="entry-category"></select></label><label id="payment-label">결제수단<select id="entry-payment" required><option value="">선택해 주세요</option><option>신용카드</option><option>체크카드</option><option>현금</option><option>계좌이체</option><option>간편결제</option><option>기타</option></select></label><label class="entry-wide">내용<input id="entry-memo" type="text" maxlength="200" placeholder="예: 점심 식사" required></label></div><div class="entry-bottom"><p class="entry-help">내역 추가는 화면에 반영됩니다. GitHub 저장을 눌러 한 번에 저장하세요.</p><button id="entry-submit" type="submit" class="primary">지출 추가</button></div></fieldset><p id="entry-result" class="entry-result" role="status" aria-live="polite"></p></form></section><section class="day-list" aria-labelledby="day-list-title"><div class="day-list-head"><h2 id="day-list-title">선택한 날짜의 내역</h2><div class="day-list-head-tools"><span id="day-list-count" class="day-list-count" role="status" aria-live="polite"></span><button id="day-list-edit" class="day-list-edit" type="button" aria-pressed="false" disabled>편집</button></div></div><div class="day-list-scroll" id="day-list-table"><table><thead><tr><th scope="col">구분</th><th scope="col">사람</th><th scope="col">분류</th><th scope="col">내용</th><th scope="col">결제수단</th><th scope="col" style="text-align:right">금액</th><th id="day-list-delete-head" scope="col" style="text-align:right" hidden>삭제</th></tr></thead><tbody id="day-list-rows"></tbody></table></div><div id="day-list-empty" class="day-list-empty">내역을 불러오는 중입니다.</div><p id="day-list-edit-note" class="day-list-edit-note" hidden>행의 <strong>삭제</strong>를 누르면 목록에서 바로 사라집니다. 이미 저장된 내역은 하단 <strong>GitHub 저장</strong>을 눌러야 GitHub 파일에서도 지워집니다.</p><p class="day-list-note">사람·날짜·구분·금액·분류·내용이 모두 같고, 지출은 결제수단까지 같으면 중복으로 처리합니다.</p></section></main><header><nav aria-label="GitHub 연결 관리"><div class="status" role="status"><span id="dot" class="dot" aria-hidden="true"></span><span id="status">GitHub 연결 확인 중</span></div><div class="actions"><button id="disconnect">연결 해제</button><button id="save" class="primary" disabled>GitHub 저장</button><button id="reload" disabled>불러오기</button><button id="delete-file" class="danger" disabled>파일 삭제</button></div></nav></header><script>'use strict';const $=id=>document.getElementById(id);const SESSION='moa.github.session.v1';const PENDING='moa.pending.v1',DRAFT='moa.entry.draft.v1',VIEW_MONTH='moa.view.month.v1',VIEW_DATE='moa.view.date.v1',DELETED='moa.deleted.v1';let savedPending=null,savedDraft=null,savedMonth=null,savedDate=null,savedDeleted=null;try{savedPending=sessionStorage.getItem(PENDING);savedDraft=sessionStorage.getItem(DRAFT);savedMonth=sessionStorage.getItem(VIEW_MONTH);savedDate=sessionStorage.getItem(VIEW_DATE);savedDeleted=sessionStorage.getItem(DELETED);sessionStorage.removeItem(VIEW_DATE)}catch{}const won=n=>new Intl.NumberFormat('ko-KR').format(n)+'원';let noticeTimer;function notify(m,error=false){clearTimeout(noticeTimer);$('notice').textContent=m;$('notice').classList.toggle('error',error);noticeTimer=setTimeout(()=>{$('notice').textContent=''},error?10000:5000)}let busy=false;function lock(value){busy=value;document.querySelectorAll('button,fieldset').forEach(e=>e.disabled=value)}async function run(fn){if(busy)return;lock(true);try{await fn()}catch(e){notify(e.message,true)}finally{lock(false)}}
function validData(obj){if(!obj||obj.version!==1||obj.currency!=='KRW'||!Array.isArray(obj.transactions))throw Error('ledger.json 형식이 맞지 않습니다. version: 1, currency: KRW, transactions 배열이 필요합니다.');const ids=new Set();for(const t of obj.transactions){if(!t||typeof t.id!=='string'||!t.id||ids.has(t.id)||!['income','expense'].includes(t.type)||!Number.isSafeInteger(t.amount)||t.amount<=0||t.amount>1e12||typeof t.date!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(t.date)||!Number.isFinite(Date.parse(t.date))||new Date(t.date).toISOString().slice(0,10)!==t.date||typeof t.category!=='string'||!t.category||t.category.length>100||typeof t.memo!=='string'||t.memo.length>200)throw Error('지원하지 않는 거래 내역이 있습니다. 원본은 변경하지 않았습니다.');if(t.paymentMethod!==undefined&&(typeof t.paymentMethod!=='string'||t.paymentMethod.length>100))throw Error('결제수단 형식을 확인해 주세요.');if(t.person!==undefined&&!['person1','person2'].includes(t.person))throw Error('사람 구분 형식을 확인해 주세요.');ids.add(t.id)}if(obj.transactions.reduce((s,t)=>s+t.amount,0)>Number.MAX_SAFE_INTEGER)throw Error('거래 합계가 지원 범위를 초과합니다.');return obj}

function yearPath(year){const slash=connection.path.lastIndexOf('/');return connection.path.slice(0,slash+1)+year+'.json'}
async function navigateDate(target,focus=false){if(busy||!ready){$('entry-date').value=calendarSelected;return}const year=target.getFullYear();if(year<1000||year>9999){$('entry-date').value=calendarSelected;return}if(year===activeYear){calendarSelected=calendarKey(target);calendarMonth=new Date(year,target.getMonth(),1);drawCalendar(focus?calendarSelected:undefined);return}if(dirty){alert('저장하지 않은 내역이 있습니다. 하단 GitHub 저장을 누른 뒤 연도를 변경해 주세요.');$('entry-date').value=calendarSelected;return}await run(async()=>{try{const c={...connection,path:yearPath(year)};await privateRepo(c);await checkBranch(c);let r=await existingFile(c);let next=r?decode(r):{version:1,currency:'KRW',transactions:[]};const action=r?'파일이 있습니다. 불러올까요?':'파일이 없습니다. 빈 가계부 파일을 생성하고 불러올까요?';const message=c.path+' '+action+(dirty?'\n현재 '+connection.path+'의 미저장 내역을 먼저 저장합니다.':'')+(entryHasDraft()?'\n입력 중인 금액·내용은 유지하고 날짜를 변경합니다.':'');if(!r&&!confirm(message))return;let created=false;if(!r){try{const result=await api(c,file(c),'PUT',{message:'Create annual ledger',content:encode(next),branch:c.branch});if(!result.content?.sha)throw Error('파일 생성 결과를 확인하지 못했습니다. 다시 해당 연도로 이동해 확인하세요.');created=true}catch(e){if(e.status!==409&&e.status!==422)throw e;r=await existingFile(c);if(!r)throw e}r=await remote(c);next=decode(r)}try{sessionStorage.setItem(SESSION,JSON.stringify(c))}catch{throw Error('새 연결 정보를 보관하지 못했습니다. 현재 연도를 유지합니다.')}connection=c;data=next;sha=r.sha;dirty=false;pendingTransactions=[];pendingDeletions=[];storePending();storeDeleted();activeYear=year;calendarSelected=calendarKey(target);calendarMonth=new Date(year,target.getMonth(),1);$('entry-result').textContent='';drawCalendar(focus?calendarSelected:undefined);notify(c.path+'에서 '+data.transactions.length+'건을 불러왔습니다.');if(created)alert(c.path+' 파일을 생성하고 불러왔습니다.')}catch(e){alert('연도 전환을 완료하지 못했습니다.\n'+e.message);throw e}finally{$('entry-date').value=calendarSelected}})}

const entryCategories={expense:['식비','카페·간식','교통·차량','주거·관리비','공과금·통신','생활용품','쇼핑·미용','의료·건강','보험','교육·자기계발','문화·여가','구독·멤버십','여행·숙박','경조사·선물','가족·육아','반려동물','세금·수수료','대출이자','기타 지출'],income:['급여','상여·성과급','사업·부업','용돈·선물','이자·배당','지원금·연금','중고판매','환급·캐시백','기타 수입']};
function entryHasDraft(){return !!($('entry-amount').value||$('entry-memo').value.trim())}
let selectedEntryType='expense';function entryType(){return selectedEntryType}
function entryCategoryOptions(){const expense=entryType()==='expense';$('payment-label').hidden=!expense;$('entry-payment').disabled=!expense;$('entry-payment').required=expense;const options=entryCategories[entryType()].map(name=>{const o=document.createElement('option');o.value=name;o.textContent=name;return o});$('entry-category').replaceChildren(...options)}
function clearEntry(){$('entry-amount').value='';$('entry-memo').value='';$('entry-date').value=calendarSelected;$('entry-result').textContent='';$('entry-result').classList.toggle('error',false);storeDraft()}
function openEntry(type){if(busy||!ready)return;if(selectedEntryType===type&&!$('entry-form').hidden){closeEntry();return}const changed=selectedEntryType!==type;selectedEntryType=type;if(changed)entryCategoryOptions();$('entry-form').hidden=false;$('entry-close').hidden=false;$('entry-date').value=calendarSelected;$('entry-submit').textContent=type==='income'?'수입 추가':'지출 추가';for(const t of ['expense','income']){const active=t===type;$('open-'+t).setAttribute('aria-expanded',String(active));$('open-'+t).setAttribute('aria-pressed',String(active))}$('entry-amount').focus()}
$('open-expense').onclick=()=>openEntry('expense');$('open-income').onclick=()=>openEntry('income');
function closeEntry(){$('entry-form').hidden=true;$('entry-close').hidden=true;for(const t of ['expense','income']){$('open-'+t).setAttribute('aria-expanded','false');$('open-'+t).setAttribute('aria-pressed','false')}$('open-'+selectedEntryType).focus()}
$('entry-close').onclick=closeEntry;
$('entry-date').onchange=()=>{const value=$('entry-date').value;if(!/^\d{4}-\d{2}-\d{2}$/.test(value))return;const [y,m,d]=value.split('-').map(Number);const date=new Date(y,m-1,d);if(calendarKey(date)!==value)return;navigateDate(date)};

function sameEntry(a,b){return (a.person||'')===(b.person||'')&&a.date===b.date&&a.type===b.type&&a.amount===b.amount&&a.category===b.category&&a.memo.trim()===b.memo.trim()&&(a.type!=='expense'||(a.paymentMethod||'')===(b.paymentMethod||''))}
$('entry-form').onsubmit=e=>{e.preventDefault();if(busy||!ready)return;return run(async()=>{try{const type=entryType(),amount=Number($('entry-amount').value.replace(/,/g,'')),memo=$('entry-memo').value.trim(),date=$('entry-date').value,category=$('entry-category').value;if(!Number.isSafeInteger(amount)||amount<1||amount>1000000000000)throw Error('금액은 1원부터 1조 원까지 입력하세요.');if(Number(date.slice(0,4))!==activeYear)throw Error('선택한 날짜의 연도 파일을 먼저 불러와 주세요.');if(!memo)throw Error('내용을 입력해 주세요.');const person=$('person2').checked?'person2':'person1';const candidate={id:crypto.randomUUID(),type,amount,date,category,memo,person};if(type==='expense'){const payment=$('entry-payment').value;if(!['신용카드','체크카드','현금','계좌이체','간편결제','기타'].includes(payment))throw Error('결제수단을 선택해 주세요.');candidate.paymentMethod=payment;}validData({version:1,currency:'KRW',transactions:[candidate]});if(data.transactions.some(t=>sameEntry(t,candidate))){$('entry-result').textContent='현재 목록에 동일한 내역이 있어 추가하지 않았습니다.';$('entry-result').classList.toggle('error',false);return}const next={...data,transactions:[...data.transactions,candidate]};validData(next);encode(next);data=next;pendingTransactions.push(candidate);dirty=true;storePending();clearEntry();drawCalendar();const message=date+' · '+(type==='income'?'수입':'지출')+' '+won(amount)+' · '+memo+' 추가 완료. GitHub 저장을 눌러주세요.';$('entry-result').textContent=message;notify(message)}catch(error){const message='내역을 추가하지 못했습니다. 입력 내용을 유지했습니다.\n'+error.message;$('entry-result').textContent=message;$('entry-result').classList.toggle('error',true);notify(message,true)}})};
window.addEventListener('beforeunload',e=>{if(!internalNav&&(dirty||entryHasDraft())){e.preventDefault();e.returnValue=''}});
$('entry-amount').oninput=()=>{const el=$('entry-amount'),raw=el.value,caret=el.selectionStart??raw.length;const count=raw.slice(0,caret).replace(/[^0-9]/g,'').length;const digits=raw.replace(/[^0-9]/g,'').replace(/^0+(?=\d)/,'');el.value=digits.replace(/\B(?=(\d{3})+(?!\d))/g,',');let pos=0,seen=0;while(pos<el.value.length&&seen<count){if(/[0-9]/.test(el.value[pos]))seen++;pos++}el.setSelectionRange(pos,pos)};
entryCategoryOptions();$('entry-date').value=calendarSelected;

function renderDayList(){const rows=ready&&data?data.transactions.filter(t=>t.date===calendarSelected):[];const [y,m,d]=calendarSelected.split('-').map(Number);$('day-list-title').textContent=y+'년 '+m+'월 '+d+'일 내역';$('day-list-count').textContent=ready?rows.length+'건':'';$('day-list-rows').replaceChildren();$('day-list-table').hidden=rows.length===0;$('day-list-empty').hidden=rows.length>0;$('day-list-empty').textContent=ready?'선택한 날짜에 등록된 내역이 없습니다.':'내역을 불러온 후 확인할 수 있습니다.';$('day-list-delete-head').hidden=!editMode||rows.length===0;$('day-list-edit-note').hidden=!editMode;const pendingIds=new Set(pendingTransactions.map(t=>t.id));for(const t of rows){const tr=document.createElement('tr');const kind=document.createElement('td');kind.className='kind '+t.type;kind.textContent=t.type==='income'?'수입':'지출';const category=document.createElement('td');category.textContent=t.category;const memo=document.createElement('td');memo.className='memo';memo.textContent=t.memo;if(pendingIds.has(t.id)){const badge=document.createElement('span');badge.className='pending';badge.textContent='미저장';memo.append(badge)}const amount=document.createElement('td');amount.className='amount '+t.type;amount.textContent=(t.type==='income'?'+':'−')+won(t.amount);const payment=document.createElement('td');payment.textContent=t.type==='expense'?(t.paymentMethod||'미지정'):'—';const person=document.createElement('td');person.append(personTag(t.person));tr.append(kind,person,category,memo,payment,amount);if(editMode){const actions=document.createElement('td');actions.className='delete-cell';const remove=document.createElement('button');remove.type='button';remove.className='day-delete';remove.textContent='삭제';remove.disabled=busy||!ready;remove.setAttribute('aria-label',(t.type==='income'?'수입':'지출')+' '+won(t.amount)+' · '+t.memo+' 내역 삭제');remove.onclick=()=>deleteTransaction(t.id);actions.append(remove);tr.append(actions)}$('day-list-rows').append(tr)}}

function calendarTotals(){const result=Object.create(null);if(!ready||!data)return result;for(const t of data.transactions){if(!result[t.date])result[t.date]={expense:0,income:0};result[t.date][t.type]+=t.amount}return result}

function queueCalendarFit(){if(typeof requestAnimationFrame!=='function')return;requestAnimationFrame(fitCalendarAmounts)}
function fitCalendarAmounts(){document.querySelectorAll('.calendar .day-total').forEach(el=>{el.style.fontSize='';const width=el.clientWidth;if(!width)return;const font=parseFloat(getComputedStyle(el).fontSize);if(el.scrollWidth>width)el.style.fontSize=(Math.floor(font*width/el.scrollWidth*10)/10)+'px'})}
window.addEventListener('resize',queueCalendarFit);
const actionBar=document.querySelector('header');function fitActionBar(){document.documentElement.style.setProperty('--bar-h',actionBar.offsetHeight+'px')}fitActionBar();window.addEventListener('resize',fitActionBar);if(typeof ResizeObserver!=='undefined')new ResizeObserver(fitActionBar).observe(actionBar);
if(typeof ResizeObserver!=='undefined'){const calendarObserver=new ResizeObserver(queueCalendarFit);calendarObserver.observe($('calendar-days'))}

$('delete-file').onclick=()=>{if(busy||!ready||!connection)return;const target={...connection},expectedSha=sha;const entered=prompt('GitHub 파일 삭제\n\n저장소: '+target.owner+'/'+target.repo+'\n브랜치: '+target.branch+'\n파일: '+target.path+'\n\n이 파일의 전체 거래 내역이 삭제됩니다.'+((dirty||entryHasDraft())?' 저장하지 않은 내역과 작성 중인 내용도 화면에서 사라집니다.':'')+'\n계속하려면 파일 경로를 정확히 입력하세요: '+target.path);if(entered===null)return;if(entered!==target.path){notify('파일 경로가 일치하지 않아 삭제하지 않았습니다.',true);return}return run(async()=>{await privateRepo(target);const current=await remote(target);if(current.type!=='file'||current.sha!==expectedSha)throw Error('파일이 변경되었거나 확인할 수 없습니다. 삭제하지 않았습니다. 최신 파일을 확인한 뒤 다시 시도하세요.');await api(target,file(target),'DELETE',{message:'Delete ledger file',sha:current.sha,branch:target.branch});connection=null;data=null;sha=null;ready=false;dirty=false;pendingTransactions=[];pendingDeletions=[];storePending();storeDeleted();clearEntry();drawCalendar();try{sessionStorage.removeItem(SESSION)}catch{}alert(target.path+' 파일을 삭제했습니다. 연결 페이지로 이동합니다.\nGitHub의 이전 커밋 기록에는 데이터가 남을 수 있습니다.');location.replace('index.html')})};

function personTag(person){const tag=document.createElement('span');tag.className='person-tag '+(person==='person1'||person==='person2'?person:'unspecified');tag.textContent=person==='person1'?'🍓':person==='person2'?'⛰️':'미지정';return tag}


function storePending(){try{if(pendingTransactions.length)sessionStorage.setItem(PENDING,JSON.stringify(pendingTransactions));else sessionStorage.removeItem(PENDING)}catch{}}
function restorePending(){let stored;try{stored=JSON.parse(savedPending||'null')}catch{return}finally{savedPending=null}
if(!Array.isArray(stored)||!stored.length||!ready||!data)return;
const restored=[];
for(const t of stored){try{validData({version:1,currency:'KRW',transactions:[t]})}catch{continue}
if(Number(t.date.slice(0,4))!==activeYear)continue;
if(data.transactions.some(x=>x.id===t.id||sameEntry(x,t)))continue;
restored.push(t)}
pendingTransactions=restored;
if(restored.length)data={...data,transactions:[...data.transactions,...restored]};
syncDirty();storePending();controls()}
function storeDeleted(){try{if(pendingDeletions.length)sessionStorage.setItem(DELETED,JSON.stringify(pendingDeletions));else sessionStorage.removeItem(DELETED)}catch{}}
function restoreDeleted(){let stored;try{stored=JSON.parse(savedDeleted||'null')}catch{return}finally{savedDeleted=null}
if(!Array.isArray(stored)||!stored.length||!ready||!data)return;
const kept=[];
for(const t of stored){try{validData({version:1,currency:'KRW',transactions:[t]})}catch{continue}
if(Number(t.date.slice(0,4))!==activeYear)continue;
const current=data.transactions.find(x=>x.id===t.id);
if(!current||!sameEntry(current,t))continue;
kept.push(t)}
pendingDeletions=kept;
if(kept.length){const ids=new Set(kept.map(t=>t.id));data={...data,transactions:data.transactions.filter(t=>!ids.has(t.id))}}
syncDirty();storeDeleted();controls()}
function notifyRestored(){const parts=[];
if(pendingTransactions.length)parts.push('저장하지 않은 내역 '+pendingTransactions.length+'건');
if(pendingDeletions.length)parts.push('삭제 예정 '+pendingDeletions.length+'건');
if(parts.length)notify(parts.join(' · ')+'이 남아 있습니다. GitHub 저장을 눌러주세요.')}
function deleteTransaction(id){if(busy||!ready||!data)return;
const target=data.transactions.find(t=>t.id===id);
if(!target)return;
const pendingIndex=pendingTransactions.findIndex(t=>t.id===id);
const label=target.date+' · '+(target.type==='income'?'수입':'지출')+' '+won(target.amount)+' · '+target.memo;
if(!confirm(pendingIndex>=0?'아직 저장하지 않은 내역입니다. 목록에서 지울까요?\n\n'+label:'이 내역을 삭제할까요?\n\n'+label+'\n\n화면에서 바로 사라지고, 하단 GitHub 저장을 눌러야 GitHub 파일에도 반영됩니다.'))return;
data={...data,transactions:data.transactions.filter(t=>t.id!==id)};
if(pendingIndex>=0)pendingTransactions.splice(pendingIndex,1);else pendingDeletions.push(target);
syncDirty();storePending();storeDeleted();drawCalendar();controls();
notify(pendingIndex>=0?'미저장 내역을 목록에서 지웠습니다.':'삭제 예정으로 표시했습니다. GitHub 저장을 눌러 반영하세요.')}
function setEditMode(value){editMode=!!value;$('day-list-edit').setAttribute('aria-pressed',String(editMode));$('day-list-edit').textContent=editMode?'편집 완료':'편집';renderDayList()}
$('day-list-edit').onclick=()=>{if(busy||!ready)return;setEditMode(!editMode)};
function storeMonth(){try{sessionStorage.setItem(VIEW_MONTH,calendarMonth.getFullYear()+'-'+String(calendarMonth.getMonth()+1).padStart(2,'0'))}catch{}}
function storeDraft(){try{const amount=$('entry-amount').value,memo=$('entry-memo').value,open=!$('entry-form').hidden;
if(!amount&&!memo.trim()&&!open){sessionStorage.removeItem(DRAFT);return}
sessionStorage.setItem(DRAFT,JSON.stringify({type:selectedEntryType,amount,memo,category:$('entry-category').value,payment:$('entry-payment').value,person:$('person2').checked?'person2':'person1',open}))}catch{}}
function restoreDraft(){let draft;try{draft=JSON.parse(savedDraft||'null')}catch{return}finally{savedDraft=null}
if(!draft||!ready)return;
if(draft.type==='income'||draft.type==='expense'){selectedEntryType=draft.type;entryCategoryOptions()}
if(typeof draft.amount==='string')$('entry-amount').value=draft.amount;
if(typeof draft.memo==='string')$('entry-memo').value=draft.memo;
if(draft.person==='person2')$('person2').checked=true;
if(typeof draft.category==='string'&&[...$('entry-category').options].some(o=>o.value===draft.category))$('entry-category').value=draft.category;
if(typeof draft.payment==='string'&&[...$('entry-payment').options].some(o=>o.value===draft.payment))$('entry-payment').value=draft.payment;
if(draft.open&&$('entry-form').hidden)openEntry(selectedEntryType)}
for(const id of ['entry-amount','entry-memo','entry-category','entry-payment','person1','person2'])$(id).addEventListener('change',storeDraft);
$('entry-amount').addEventListener('input',storeDraft);$('entry-memo').addEventListener('input',storeDraft);
let internalNav=false;
document.querySelectorAll('.top-menu a').forEach(link=>link.addEventListener('click',()=>{storeDraft();internalNav=true}));

$('notice').onclick=()=>{clearTimeout(noticeTimer);$('notice').textContent=''};
</script></body></html>
