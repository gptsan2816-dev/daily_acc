gin:0 30px 14px;font-size:13px;color:#2459c4;font-weight:650}.history-filter-note:empty{display:none}.history-person{display:flex;flex-wrap:wrap;gap:8px 16px;margin:0 30px 20px;font-size:13px;color:#74839a}.history-person:empty{display:none}.history-person-item{display:inline-flex;align-items:center;gap:6px}.history-day{border-top:1px solid #eaeff6}.history-day-head{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;border:0;border-radius:0;background:#f7f9fc;padding:12px 30px;font:inherit;font-size:14px;font-weight:700;color:#34455f;text-align:left;cursor:pointer}.history-day-head:hover{background:#eef4ff}.history-day-head:focus-visible{outline:3px solid #8ab3ff;outline-offset:-3px}.history-day-sums{display:flex;gap:10px;font-variant-numeric:tabular-nums;font-weight:650}.history-day-sums .expense{color:#bc4b58}.history-day-sums .income{color:#2563eb}.history-rows{list-style:none;margin:0;padding:0}.history-row{display:flex;align-items:flex-start;gap:12px;padding:13px 30px;border-bottom:1px solid #f1f4f9;font-size:14px}.history-row:last-child{border-bottom:0}.history-row .kind{flex:none;white-space:nowrap;font-weight:650}.history-row .main{flex:1;min-width:0;overflow-wrap:anywhere}.history-row .sub{display:block;margin-top:4px;font-size:13px;color:#74839a}.history-row .sub .person-tag{font-size:12px;padding:2px 7px;vertical-align:middle}.history-row .amount{flex:none;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;font-weight:700}.history-row .income,.history-row .kind.income{color:#2563eb}.history-row .expense,.history-row .kind.expense{color:#bc4b58}.history-empty{text-align:center;padding:40px 16px;font-size:14px;color:#7c8ba1;border-top:1px solid #eaeff6}.history-note{margin:0;padding:14px 30px 20px;font-size:13px;color:#7c8ba1;border-top:1px solid #eaeff6}@media(max-width:580px){.history{margin-top:12px;border-radius:15px}.history-head{padding:20px 16px;gap:12px;flex-wrap:wrap}.history h1{font-size:22px}.history-summary{grid-template-columns:1fr;gap:8px;padding:0 16px 14px}.history-card{display:flex;align-items:center;justify-content:space-between;padding:12px 14px}.history-card strong{margin:0;font-size:19px}.history-filters{padding:0 16px 14px}.history-filter-field select{min-width:0;flex:1}.history-filter-note{margin:0 16px 12px}.history-person{margin:0 16px 16px;gap:6px 12px}.history-day-head{padding:11px 16px;font-size:13px}.history-row{padding:12px 16px;gap:9px}.history-note{padding:13px 16px 18px}}
</style></head><body><div class="top-menu"><nav aria-label="주 메뉴"><a id="home-link" href="ledger.html">홈</a><a id="history-link" href="history.html" aria-current="page">내역</a></nav></div><main><div id="notice" class="notice" role="status" aria-live="polite"></div><section class="history" aria-labelledby="history-title"><div class="history-head"><h1 id="history-title" aria-live="polite">내역을 불러오는 중입니다</h1><div class="history-tools"><button id="history-today" type="button">이번 달</button><button id="history-prev" class="arrow" type="button" aria-label="이전 달">‹</button><button id="history-next" class="arrow" type="button" aria-label="다음 달">›</button></div></div><div class="history-summary" role="group" aria-label="구분 필터"><button type="button" class="history-card" id="filter-expense" aria-pressed="false"><span>지출</span><strong id="history-expense" class="expense">0원</strong></button><button type="button" class="history-card" id="filter-income" aria-pressed="false"><span>수입</span><strong id="history-income" class="income">0원</strong></button><button type="button" class="history-card total" id="filter-all" aria-pressed="true"><span>합계</span><strong id="history-net">0원</strong></button></div><div class="history-filters"><label class="history-filter-field">분류<select id="filter-category"><option value="">전체 분류</option></select></label><label class="history-filter-field" id="payment-filter-field" hidden>결제수단<select id="filter-payment"><option value="">전체 결제수단</option></select></label></div><p id="history-filter-note" class="history-filter-note"></p><p id="history-person" class="history-person"></p><div id="history-list" class="history-list"></div><div id="history-empty" class="history-empty">내역을 불러온 후 확인할 수 있습니다.</div><p class="history-note">지출·수입 카드를 누르면 그 구분만 보이고, 다시 누르면 전체가 보입니다. 분류를 고르면 해당 분류만, 지출을 볼 때는 결제수단으로도 좁혀볼 수 있습니다. 날짜 줄을 누르면 홈 화면에서 그 날짜를 볼 수 있습니다. 내역 추가는 홈 화면에서 합니다.</p></section></main><header><nav aria-label="GitHub 연결 관리"><div class="status" role="status"><span id="dot" class="dot" aria-hidden="true"></span><span id="status">GitHub 연결 확인 중</span></div><div class="actions"><button id="disconnect">연결 해제</button><button id="save" class="primary" disabled>GitHub 저장</button><button id="reload" disabled>불러오기</button></div></nav></header><script>'use strict';const $=id=>document.getElementById(id);const SESSION='moa.github.session.v1';const PENDING='moa.pending.v1',VIEW_MONTH='moa.view.month.v1',VIEW_DATE='moa.view.date.v1',VIEW_FILTER='moa.view.filter.v1',VIEW_CATEGORY='moa.view.category.v1',VIEW_PAYMENT='moa.view.payment.v1';const won=n=>new Intl.NumberFormat('ko-KR').format(n)+'원';let noticeTimer;function notify(m,error=false){clearTimeout(noticeTimer);$('notice').textContent=m;$('notice').classList.toggle('error',error);noticeTimer=setTimeout(()=>{$('notice').textContent=''},error?10000:5000)}let busy=false;function lock(value){busy=value;controls()}async function run(fn){if(busy)return;lock(true);try{await fn()}catch(e){notify(e.message,true)}finally{lock(false)}}
function validData(obj){if(!obj||obj.version!==1||obj.currency!=='KRW'||!Array.isArray(obj.transactions))throw Error('ledger.json 형식이 맞지 않습니다. version: 1, currency: KRW, transactions 배열이 필요합니다.');const ids=new Set();for(const t of obj.transactions){if(!t||typeof t.id!=='string'||!t.id||ids.has(t.id)||!['income','expense'].includes(t.type)||!Number.isSafeInteger(t.amount)||t.amount<=0||t.amount>1e12||typeof t.date!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(t.date)||!Number.isFinite(Date.parse(t.date))||new Date(t.date).toISOString().slice(0,10)!==t.date||typeof t.category!=='string'||!t.category||t.category.length>100||typeof t.memo!=='string'||t.memo.length>200)throw Error('지원하지 않는 거래 내역이 있습니다. 원본은 변경하지 않았습니다.');if(t.paymentMethod!==undefined&&(typeof t.paymentMethod!=='string'||t.paymentMethod.length>100))throw Error('결제수단 형식을 확인해 주세요.');if(t.person!==undefined&&!['person1','person2'].includes(t.person))throw Error('사람 구분 형식을 확인해 주세요.');ids.add(t.id)}if(obj.transactions.reduce((s,t)=>s+t.amount,0)>Number.MAX_SAFE_INTEGER)throw Error('거래 합계가 지원 범위를 초과합니다.');return obj}
const base=c=>`/repos/${encodeURIComponent(c.owner)}/${encodeURIComponent(c.repo)}`;
const file=c=>base(c)+'/contents/'+c.path.split('/').map(encodeURIComponent).join('/');
async function api(c,url,method='GET',body){let response;try{response=await fetch('https://api.github.com'+url,{method,headers:{Accept:'application/vnd.github+json',Authorization:'Bearer '+c.token,'X-GitHub-Api-Version':'2026-03-10',...(body?{'Content-Type':'application/json'}:{})},body:body?JSON.stringify(body):undefined,cache:'no-store',credentials:'omit',redirect:'error',signal:AbortSignal.timeout(25000)})}catch(e){throw Error(method==='DELETE'?'삭제 결과를 확인하지 못했습니다. GitHub에서 파일 존재 여부를 확인해 주세요.':method==='PUT'?'저장 결과를 확인하지 못했습니다. 재저장 전에 백업하고 최신 내역을 불러와 확인하세요.':'연결할 수 없습니다. 네트워크를 확인하고 다시 시도하세요.')}if(!response.ok){const msg={401:'토큰이 유효하지 않거나 만료되었습니다.',403:'접근 권한 또는 API 사용 한도를 확인하세요. Contents: Read and write 권한이 필요합니다.',404:'저장소·브랜치·파일을 찾을 수 없거나 접근 권한이 없습니다. 연결 정보와 토큰의 저장소 선택을 확인하세요.',409:'다른 변경과 충돌했습니다. 현재 내역을 백업하고 최신 데이터를 불러오세요.',422:'저장이 거부되었습니다. 파일 버전, 브랜치 보호 규칙과 토큰 권한을 확인하세요.'};const error=Error(msg[response.status]||`GitHub 요청에 실패했습니다 (${response.status}).`);error.status=response.status;throw error}return response.json()}
async function privateRepo(c){const r=await api(c,base(c));if(r.private!==true)throw Error('가계부 보호를 위해 비공개 저장소만 연결할 수 있습니다.')}
const remote=c=>api(c,file(c)+'?ref='+encodeURIComponent(c.branch));
function decode(r){if(r.type!=='file'||r.encoding!=='base64'||!r.sha||r.size>900000)throw Error('900KB 이하의 JSON 파일만 지원합니다. 파일 크기와 경로를 확인하세요.');try{return validData(JSON.parse(new TextDecoder('utf-8',{fatal:true}).decode(Uint8Array.from(atob(r.content.replace(/\s/g,'')),ch=>ch.charCodeAt(0)))))}catch(e){throw Error('데이터를 불러오지 못했습니다. '+e.message)}}
function encode(obj){const bytes=new TextEncoder().encode(JSON.stringify(obj,null,2)+'\n');if(bytes.length>900000)throw Error('데이터가 900KB를 넘습니다. 백업 후 기간별 저장소를 사용하세요.');let s='';for(let i=0;i<bytes.length;i+=8192)s+=String.fromCharCode(...bytes.subarray(i,i+8192));return btoa(s)}
async function checkBranch(c){try{await api(c,base(c)+'/branches/'+encodeURIComponent(c.branch))}catch(e){if(e.status===404||e.status===409)throw Error('브랜치를 확인할 수 없습니다. 브랜치 이름을 확인하고, 빈 저장소라면 GitHub에서 README 파일을 먼저 추가하세요.');throw e}}
async function existingFile(c){try{return await remote(c)}catch(e){if(e.status===404)return null;throw e}}
function sameEntry(a,b){return (a.person||'')===(b.person||'')&&a.date===b.date&&a.type===b.type&&a.amount===b.amount&&a.category===b.category&&a.memo.trim()===b.memo.trim()&&(a.type!=='expense'||(a.paymentMethod||'')===(b.paymentMethod||''))}
function personTag(person){const tag=document.createElement('span');tag.className='person-tag '+(person==='person1'||person==='person2'?person:'unspecified');tag.textContent=person==='person1'?'🍓':person==='person2'?'⛰️':'미지정';return tag}

let filter='all',category='',payment='';try{const stored=sessionStorage.getItem(VIEW_FILTER);if(stored==='expense'||stored==='income')filter=stored;
const storedCategory=sessionStorage.getItem(VIEW_CATEGORY);if(storedCategory)category=storedCategory;
const storedPayment=sessionStorage.getItem(VIEW_PAYMENT);if(storedPayment)payment=storedPayment}catch{}
function persistFilters(){try{
if(category)sessionStorage.setItem(VIEW_CATEGORY,category);else sessionStorage.removeItem(VIEW_CATEGORY);
if(payment)sessionStorage.setItem(VIEW_PAYMENT,payment);else sessionStorage.removeItem(VIEW_PAYMENT)}catch{}}
function setFilter(next){filter=next!=='all'&&filter===next?'all':next;
if(filter==='all'){category='';payment=''}
try{if(filter==='all')sessionStorage.removeItem(VIEW_FILTER);else sessionStorage.setItem(VIEW_FILTER,filter)}catch{}
persistFilters();render()}
function optionsFor(values){return [...new Set(values)].sort((a,b)=>a.localeCompare(b,'ko'))}
let connection=null,data=null,ready=false,pending=[],activeYear=null,viewMonth=new Date(new Date().getFullYear(),new Date().getMonth(),1);

function controls(){['history-prev','history-next','history-today','filter-expense','filter-income','filter-all','filter-category','filter-payment'].forEach(id=>$(id).disabled=busy||!ready);
$('save').disabled=busy||!ready||!pending.length;
$('reload').disabled=busy||!connection;
$('disconnect').disabled=busy;
$('dot').classList.toggle('connected',ready);
$('status').textContent=ready?(pending.length?'GitHub 연결됨 · '+connection.path+' · 저장 필요 '+pending.length+'건':'GitHub 연결됨 · '+connection.path):connection?'GitHub 연결 확인 필요':'GitHub 연결 안 됨'}

function readPending(){let stored;try{stored=JSON.parse(sessionStorage.getItem(PENDING)||'null')}catch{return []}
if(!Array.isArray(stored))return [];
const kept=[];
for(const t of stored){try{validData({version:1,currency:'KRW',transactions:[t]})}catch{continue}kept.push(t)}
return kept}
function writePending(){try{if(pending.length)sessionStorage.setItem(PENDING,JSON.stringify(pending));else sessionStorage.removeItem(PENDING)}catch{}}
function storeMonth(){try{sessionStorage.setItem(VIEW_MONTH,viewMonth.getFullYear()+'-'+String(viewMonth.getMonth()+1).padStart(2,'0'))}catch{}}
function restoreMonth(){let month;try{month=sessionStorage.getItem(VIEW_MONTH)}catch{return}
if(typeof month!=='string'||!/^\d{4}-\d{2}$/.test(month))return;
const [y,m]=month.split('-').map(Number);
if(y===activeYear&&m>=1&&m<=12)viewMonth=new Date(y,m-1,1)}

function combined(){if(!ready||!data)return [];
const rows=[...data.transactions];
for(const t of pending)if(!rows.some(x=>x.id===t.id||sameEntry(x,t)))rows.push(t);
return rows}

async function loadData(silent=false){await privateRepo(connection);
const r=await remote(connection);
data=decode(r);
ready=true;
pending=readPending().filter(t=>Number(t.date.slice(0,4))===activeYear&&!data.transactions.some(x=>x.id===t.id||sameEntry(x,t)));
writePending();
render();
if(!silent)notify('GitHub에서 불러왔습니다. '+new Date().toLocaleTimeString('ko-KR'))}
$('reload').onclick=()=>run(()=>loadData());

async function saveCurrent(){if(!ready||!data||!pending.length)return;
await privateRepo(connection);
for(let attempt=0;attempt<3;attempt++){const r=await remote(connection),latest=decode(r);
const merged=[...latest.transactions];
let added=0;
for(const t of pending){const existing=merged.find(x=>x.id===t.id);
if(existing&&!sameEntry(existing,t))throw Error('같은 ID의 내역이 변경되었습니다. 미저장 내역을 유지했습니다.');
if(merged.some(x=>sameEntry(x,t)))continue;
merged.push(t);added++}
const next={...latest,transactions:merged};
validData(next);
if(added){try{const result=await api(connection,file(connection),'PUT',{message:'Save ledger entries',content:encode(next),sha:r.sha,branch:connection.branch});
if(!result.content?.sha)throw Error('저장 결과를 확인하지 못했습니다. GitHub 저장을 다시 누르면 중복 확인 후 처리합니다.')}catch(error){if((error.status===409||error.status===422)&&attempt<2)continue;throw error}}
const duplicates=pending.length-added;
data=next;pending=[];writePending();render();
notify('GitHub 동기화 완료 · 새 내역 '+added+'건 저장'+(duplicates?' · 중복 '+duplicates+'건 제외':''));
return}}
$('save').onclick=()=>run(saveCurrent);

$('disconnect').onclick=()=>{if(busy)return;
if(pending.length&&!confirm('저장하지 않은 내역 '+pending.length+'건을 버리고 연결을 해제할까요?'))return;
try{sessionStorage.removeItem(SESSION);sessionStorage.removeItem(PENDING);sessionStorage.removeItem(VIEW_DATE)}catch{notify('연결 정보를 삭제하지 못했습니다. 탭을 닫아 주세요.',true);return}
location.replace('index.html')};

async function init(){try{const c=JSON.parse(sessionStorage.getItem(SESSION)||'null');
if(!c||['owner','repo','path','branch','token'].some(k=>typeof c[k]!=='string'||!c[k])){location.replace('index.html');return}
connection=c}catch{location.replace('index.html');return}
const match=connection.path.match(/(?:^|\/)(\d{4})\.json$/);
activeYear=match?Number(match[1]):new Date().getFullYear();
const now=new Date();
viewMonth=new Date(activeYear,activeYear===now.getFullYear()?now.getMonth():0,1);
restoreMonth();storeMonth();
await run(async()=>{await loadData(true);
if(pending.length)notify('저장하지 않은 내역 '+pending.length+'건이 목록에 포함되어 있습니다. GitHub 저장을 눌러주세요.')})}
init();

function yearPath(year){const slash=connection.path.lastIndexOf('/');return connection.path.slice(0,slash+1)+year+'.json'}
async function goMonth(target){if(busy||!ready)return;
const year=target.getFullYear();
if(year<1000||year>9999)return;
if(year===activeYear){viewMonth=new Date(year,target.getMonth(),1);storeMonth();render();return}
if(pending.length){alert('저장하지 않은 내역이 있습니다. 하단 GitHub 저장을 누른 뒤 연도를 변경해 주세요.');return}
await run(async()=>{try{const c={...connection,path:yearPath(year)};
await privateRepo(c);await checkBranch(c);
let r=await existingFile(c);
if(!r&&!confirm(c.path+' 파일이 없습니다. 빈 가계부 파일을 생성하고 불러올까요?'))return;
let created=false;
if(!r){try{const result=await api(c,file(c),'PUT',{message:'Create annual ledger',content:encode({version:1,currency:'KRW',transactions:[]}),branch:c.branch});
if(!result.content?.sha)throw Error('파일 생성 결과를 확인하지 못했습니다. 다시 해당 연도로 이동해 확인하세요.');
created=true}catch(e){if(e.status!==409&&e.status!==422)throw e;r=await existingFile(c);if(!r)throw e}
r=await remote(c)}
const next=decode(r);
try{sessionStorage.setItem(SESSION,JSON.stringify(c))}catch{throw Error('새 연결 정보를 보관하지 못했습니다. 현재 연도를 유지합니다.')}
connection=c;data=next;activeYear=year;pending=[];writePending();
viewMonth=new Date(year,target.getMonth(),1);storeMonth();render();
notify(c.path+'에서 '+data.transactions.length+'건을 불러왔습니다.');
if(created)alert(c.path+' 파일을 생성하고 불러왔습니다.')}catch(e){alert('연도 전환을 완료하지 못했습니다.\n'+e.message);throw e}})}
$('history-prev').onclick=()=>goMonth(new Date(viewMonth.getFullYear(),viewMonth.getMonth()-1,1));
$('history-next').onclick=()=>goMonth(new Date(viewMonth.getFullYear(),viewMonth.getMonth()+1,1));
$('history-today').onclick=()=>goMonth(new Date());
$('filter-expense').onclick=()=>setFilter('expense');$('filter-income').onclick=()=>setFilter('income');$('filter-all').onclick=()=>setFilter('all');
$('filter-category').onchange=()=>{category=$('filter-category').value;persistFilters();render()};
$('filter-payment').onchange=()=>{payment=$('filter-payment').value;persistFilters();render()};

function openDate(date){try{sessionStorage.setItem(VIEW_DATE,date)}catch{}
location.assign('ledger.html')}

function render(){const y=viewMonth.getFullYear(),m=viewMonth.getMonth(),prefix=y+'-'+String(m+1).padStart(2,'0')+'-';
$('history-title').textContent=y+'년 '+(m+1)+'월 내역';
const pendingIds=new Set(pending.map(t=>t.id));
const monthRows=combined().filter(t=>typeof t.date==='string'&&t.date.startsWith(prefix));
const typeRows=filter==='all'?monthRows:monthRows.filter(t=>t.type===filter);
const categoryOptions=optionsFor(typeRows.map(t=>t.category));
if(category&&!categoryOptions.includes(category)){category='';persistFilters()}
const catRows=category?typeRows.filter(t=>t.category===category):typeRows;
const paymentOptions=filter==='expense'?optionsFor(catRows.map(t=>t.paymentMethod||'결제수단 미지정')):[];
if(filter!=='expense')payment='';
if(payment&&!paymentOptions.includes(payment)){payment='';persistFilters()}
const rows=filter==='expense'&&payment?catRows.filter(t=>(t.paymentMethod||'결제수단 미지정')===payment):catRows;
let expense=0,income=0;for(const t of monthRows){if(t.type==='expense')expense+=t.amount;else income+=t.amount}
const people={person1:{expense:0,income:0},person2:{expense:0,income:0},unspecified:{expense:0,income:0}},byDate=new Map();
for(const t of rows){people[t.person==='person1'||t.person==='person2'?t.person:'unspecified'][t.type]+=t.amount;
if(!byDate.has(t.date))byDate.set(t.date,[]);byDate.get(t.date).push(t)}
$('history-expense').textContent=won(expense);$('history-income').textContent=won(income);$('history-net').textContent=won(income-expense);
for(const [id,value] of [['filter-expense','expense'],['filter-income','income'],['filter-all','all']])$(id).setAttribute('aria-pressed',String(filter===value));
const catSelect=$('filter-category');catSelect.replaceChildren(new Option('전체 분류',''),...categoryOptions.map(c=>new Option(c,c)));catSelect.value=category;
const paySelect=$('filter-payment');paySelect.replaceChildren(new Option('전체 결제수단',''),...paymentOptions.map(p=>new Option(p,p)));paySelect.value=payment;
$('payment-filter-field').hidden=filter!=='expense';
const noteParts=[];if(filter!=='all')noteParts.push(filter==='expense'?'지출':'수입');if(category)noteParts.push(category);if(payment)noteParts.push(payment);
$('history-filter-note').textContent=noteParts.length?noteParts.join(' · ')+' 표시 중 · '+rows.length+'건 · 합계 카드를 누르면 전체가 보입니다.':'';
const summary=$('history-person');summary.replaceChildren();
for(const key of ['person1','person2','unspecified']){const sums=people[key];
if(filter==='all'?!sums.expense&&!sums.income:!sums[filter])continue;
const item=document.createElement('span');item.className='history-person-item';item.append(personTag(key));
const text=document.createElement('span');
text.textContent=filter==='expense'?'지출 '+won(sums.expense):filter==='income'?'수입 '+won(sums.income):'지출 '+won(sums.expense)+' · 수입 '+won(sums.income);
item.append(text);summary.append(item)}
const list=$('history-list');list.replaceChildren();
for(const date of [...byDate.keys()].sort().reverse()){const items=byDate.get(date),[dy,dm,dd]=date.split('-').map(Number);
let dayExpense=0,dayIncome=0;for(const t of items){if(t.type==='expense')dayExpense+=t.amount;else dayIncome+=t.amount}
const group=document.createElement('div');group.className='history-day';
const head=document.createElement('button');head.type='button';head.className='history-day-head';
const label=document.createElement('span');label.textContent=dm+'월 '+dd+'일 '+new Date(dy,dm-1,dd).toLocaleDateString('ko-KR',{weekday:'short'})+' · '+items.length+'건';
const sums=document.createElement('span');sums.className='history-day-sums';
for(const type of ['expense','income']){const value=type==='expense'?dayExpense:dayIncome;if(!value)continue;
const amount=document.createElement('span');amount.className=type;amount.textContent=(type==='expense'?'−':'+')+won(value);sums.append(amount)}
head.append(label,sums);
head.setAttribute('aria-label',dy+'년 '+dm+'월 '+dd+'일 내역 '+items.length+'건, 홈 화면에서 이 날짜 보기');
head.onclick=()=>openDate(date);
const ul=document.createElement('ul');ul.className='history-rows';
for(const t of items){const li=document.createElement('li');li.className='history-row';
const kind=document.createElement('span');kind.className='kind '+t.type;kind.textContent=t.type==='income'?'수입':'지출';
const main=document.createElement('span');main.className='main';main.textContent=t.memo;
if(pendingIds.has(t.id)){const badge=document.createElement('span');badge.className='pending';badge.textContent='미저장';main.append(badge)}
const sub=document.createElement('span');sub.className='sub';
sub.append(t.category+(t.type==='expense'?' · '+(t.paymentMethod||'결제수단 미지정'):'')+' · ');sub.append(personTag(t.person));
main.append(sub);
const amount=document.createElement('span');amount.className='amount '+t.type;amount.textContent=(t.type==='income'?'+':'−')+won(t.amount);
li.append(kind,main,amount);ul.append(li)}
group.append(head,ul);list.append(group)}
list.hidden=rows.length===0;
$('history-empty').hidden=rows.length>0;
$('history-empty').textContent=ready?'이 달에 등록된 '+(noteParts.length?noteParts.join(' · ')+' ':'')+'내역이 없습니다.':'내역을 불러온 후 확인할 수 있습니다.';
controls()}

const actionBar=document.querySelector('header');
function fitActionBar(){document.documentElement.style.setProperty('--bar-h',actionBar.offsetHeight+'px')}
fitActionBar();window.addEventListener('resize',fitActionBar);
if(typeof ResizeObserver!=='undefined')new ResizeObserver(fitActionBar).observe(actionBar);
$('notice').onclick=()=>{clearTimeout(noticeTimer);$('notice').textContent=''};
</script></body></html>
