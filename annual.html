</section></main><header><nav aria-label="GitHub 연결 관리"><div class="status" role="status"><span id="dot" class="dot" aria-hidden="true"></span><span id="status">GitHub 연결 확인 중</span></div><div class="actions"><button id="disconnect">연결 해제</button><button id="save" class="primary" disabled>GitHub 저장</button><button id="reload" disabled>불러오기</button></div></nav></header><script>'use strict';const $=id=>document.getElementById(id);const SESSION='moa.github.session.v1';const PENDING='moa.pending.v1',DELETED='moa.deleted.v1',VIEW_MONTH='moa.view.month.v1',VIEW_DATE='moa.view.date.v1',VIEW_FILTER='moa.view.filter.v1',VIEW_CATEGORY='moa.view.category.v1',VIEW_PAYMENT='moa.view.payment.v1',VIEW_PERSON='moa.view.person.v1',ANNUAL_KIND='moa.view.annual.kind.v1';const won=n=>new Intl.NumberFormat('ko-KR').format(n)+'원';const short=n=>n>=100000000?(Math.round(n/10000000)/10)+'억':n>=10000?Math.round(n/10000)+'만':new Intl.NumberFormat('ko-KR').format(n);let noticeTimer;function notify(m,error=false){clearTimeout(noticeTimer);$('notice').textContent=m;$('notice').classList.toggle('error',error);noticeTimer=setTimeout(()=>{$('notice').textContent=''},error?10000:5000)}let busy=false;function lock(value){busy=value;controls()}async function run(fn){if(busy)return;lock(true);try{await fn()}catch(e){notify(e.message,true)}finally{lock(false)}}

const base=c=>'/repos/'+encodeURIComponent(c.owner)+'/'+encodeURIComponent(c.repo);

async function api(c,url,method='GET',body){let response;try{response=await fetch('https://api.github.com'+url,{method,headers:{Accept:'application/vnd.github+json',Authorization:'Bearer '+c.token,'X-GitHub-Api-Version':'2026-03-10',...(body?{'Content-Type':'application/json'}:{})},body:body?JSON.stringify(body):undefined,cache:'no-store',credentials:'omit',redirect:'error',signal:AbortSignal.timeout(25000)})}catch(e){throw Error(method==='PUT'?'저장 결과를 확인하지 못했습니다. 재저장 전에 백업하고 최신 내역을 불러와 확인하세요.':'연결할 수 없습니다. 네트워크를 확인하고 다시 시도하세요.')}if(!response.ok){const msg={401:'토큰이 유효하지 않거나 만료되었습니다.',403:'접근 권한 또는 API 사용 한도를 확인하세요. Contents: Read and write 권한이 필요합니다.',404:'저장소·브랜치·파일을 찾을 수 없거나 접근 권한이 없습니다. 연결 정보와 토큰의 저장소 선택을 확인하세요.',409:'다른 변경과 충돌했습니다. 현재 내역을 백업하고 최신 데이터를 불러오세요.',422:'저장이 거부되었습니다. 파일 버전, 브랜치 보호 규칙과 토큰 권한을 확인하세요.'};const error=Error(msg[response.status]||('GitHub 요청에 실패했습니다 ('+response.status+').'));error.status=response.status;throw error}return response.json()}

$('disconnect').disabled=busy;
$('dot').classList.toggle('connected',ready);
$('status').textContent=ready?(pending.length||deleted.length?'GitHub 연결됨 · '+connection.path+' · '+pendingLabel():'GitHub 연결됨 · '+connection.path):connection?'GitHub 연결 확인 필요':'GitHub 연결 안 됨'}

function readList(key){let stored;try{stored=JSON.parse(sessionStorage.getItem(key)||'null')}catch{return []}
if(!Array.isArray(stored))return [];
const kept=[];
for(const t of stored){try{validData({version:1,currency:'KRW',transactions:[t]})}catch{continue}kept.push(t)}
return kept}
function writeList(key,list){try{if(list.length)sessionStorage.setItem(key,JSON.stringify(list));else sessionStorage.removeItem(key)}catch{}}

function combined(){if(!ready||!data)return [];
const removed=new Set(deleted.map(t=>t.id));
const rows=data.transactions.filter(t=>!removed.has(t.id));
for(const t of pending)if(!rows.some(x=>x.id===t.id||sameEntry(x,t)))rows.push(t);
return rows.filter(t=>Number(t.date.slice(0,4))===activeYear)}

async function loadData(silent=false){await privateRepo(connection);
const r=await remote(connection);
data=decode(r);
ready=true;
pending=readList(PENDING).filter(t=>Number(t.date.slice(0,4))===activeYear&&!data.transactions.some(x=>x.id===t.id||sameEntry(x,t)));
writeList(PENDING,pending);
deleted=readList(DELETED).filter(t=>Number(t.date.slice(0,4))===activeYear&&data.transactions.some(x=>x.id===t.id&&sameEntry(x,t)));
writeList(DELETED,deleted);
render();
if(!silent)notify('GitHub에서 불러왔습니다. '+new Date().toLocaleTimeString('ko-KR'))}
$('reload').onclick=()=>run(()=>loadData());

async function saveCurrent(){if(!ready||!data||(!pending.length&&!deleted.length))return;
await privateRepo(connection);
for(let attempt=0;attempt<3;attempt++){const r=await remote(connection),latest=decode(r);
const merged=[...latest.transactions];
let removed=0,gone=0;
for(const t of deleted){const index=merged.findIndex(x=>x.id===t.id);
if(index<0){gone++;continue}
if(!sameEntry(merged[index],t))throw Error('삭제하려는 내역이 GitHub에서 변경되었습니다. 삭제하지 않았습니다. 불러오기로 최신 내역을 확인해 주세요.');
merged.splice(index,1);removed++}
let added=0;
for(const t of pending){const existing=merged.find(x=>x.id===t.id);
if(existing&&!sameEntry(existing,t))throw Error('같은 ID의 내역이 변경되었습니다. 미저장 내역을 유지했습니다.');
if(merged.some(x=>sameEntry(x,t)))continue;
merged.push(t);added++}
const next={...latest,transactions:merged};
validData(next);
if(added||removed){try{const result=await api(connection,file(connection),'PUT',{message:added&&removed?'Update ledger entries':removed?'Delete ledger entries':'Save ledger entries',content:encode(next),sha:r.sha,branch:connection.branch});
if(!result.content?.sha)throw Error('저장 결과를 확인하지 못했습니다. GitHub 저장을 다시 누르면 중복 확인 후 처리합니다.')}catch(error){if((error.status===409||error.status===422)&&attempt<2)continue;throw error}}
const duplicates=pending.length-added;
data=next;pending=[];deleted=[];writeList(PENDING,pending);writeList(DELETED,deleted);render();
notify('GitHub 동기화 완료 · 새 내역 '+added+'건 저장'+(removed?' · 삭제 '+removed+'건':'')+(duplicates?' · 중복 '+duplicates+'건 제외':'')+(gone?' · 이미 없어진 '+gone+'건 제외':''));
return}}
$('save').onclick=()=>run(saveCurrent);

$('disconnect').onclick=()=>{if(busy)return;
if((pending.length||deleted.length)&&!confirm('저장하지 않은 변경('+pendingLabel().replace('저장 필요 ','')+')을 버리고 연결을 해제할까요?'))return;
try{sessionStorage.removeItem(SESSION);sessionStorage.removeItem(PENDING);sessionStorage.removeItem(DELETED);sessionStorage.removeItem(VIEW_DATE)}catch{notify('연결 정보를 삭제하지 못했습니다. 탭을 닫아 주세요.',true);return}
location.replace('index.html')};

async function init(){try{const c=JSON.parse(sessionStorage.getItem(SESSION)||'null');
if(!c||['owner','repo','path','branch','token'].some(k=>typeof c[k]!=='string'||!c[k])){location.replace('index.html');return}
connection=c}catch{location.replace('index.html');return}
const match=connection.path.match(/(?:^|\/)(\d{4})\.json$/);
activeYear=match?Number(match[1]):new Date().getFullYear();
await run(async()=>{await loadData(true);
const parts=[];
if(pending.length)parts.push('저장하지 않은 내역 '+pending.length+'건');
if(deleted.length)parts.push('삭제 예정 '+deleted.length+'건');
if(parts.length)notify(parts.join(' · ')+'이 반영되어 있습니다. GitHub 저장을 눌러주세요.')})}
init();

function yearPath(year){const slash=connection.path.lastIndexOf('/');return connection.path.slice(0,slash+1)+year+'.json'}
async function goYear(year){if(busy||!ready||year===activeYear)return;
if(year<1000||year>9999)return;
if(pending.length||deleted.length){alert('저장하지 않은 변경이 있습니다. 하단 GitHub 저장을 누른 뒤 연도를 변경해 주세요.');return}
await run(async()=>{try{const c={...connection,path:yearPath(year)};
await privateRepo(c);await checkBranch(c);
let r=await existingFile(c);
if(!r&&!confirm(c.path+' 파일이 없습니다. 빈 가계부 파일을 생성하고 볼까요?'))return;
let created=false;
if(!r){try{const result=await api(c,file(c),'PUT',{message:'Create annual ledger',content:encode({version:1,currency:'KRW',transactions:[]}),branch:c.branch});
if(!result.content?.sha)throw Error('파일 생성 결과를 확인하지 못했습니다. 다시 해당 연도로 이동해 확인하세요.');
created=true}catch(e){if(e.status!==409&&e.status!==422)throw e;r=await existingFile(c);if(!r)throw e}
r=await remote(c)}
const next=decode(r);
try{sessionStorage.setItem(SESSION,JSON.stringify(c));sessionStorage.removeItem(VIEW_MONTH)}catch{throw Error('새 연결 정보를 보관하지 못했습니다. 현재 연도를 유지합니다.')}
connection=c;data=next;activeYear=year;pending=[];deleted=[];writeList(PENDING,pending);writeList(DELETED,deleted);
render();
notify(c.path+'에서 '+data.transactions.length+'건을 불러왔습니다.');
if(created)alert(c.path+' 파일을 생성했습니다.')}catch(e){alert('연도 전환을 완료하지 못했습니다.\n'+e.message);throw e}})}
$('year-prev').onclick=()=>goYear(activeYear-1);
$('year-next').onclick=()=>goYear(activeYear+1);
$('year-this').onclick=()=>goYear(new Date().getFullYear());
function setKind(next){kind=next;expanded=null;try{if(kind==='expense')sessionStorage.removeItem(ANNUAL_KIND);else sessionStorage.setItem(ANNUAL_KIND,kind)}catch{}render()}
$('cat-expense').onclick=()=>setKind('expense');$('cat-income').onclick=()=>setKind('income');

function openMonth(month){try{sessionStorage.setItem(VIEW_MONTH,activeYear+'-'+String(month).padStart(2,'0'));
sessionStorage.removeItem(VIEW_FILTER);sessionStorage.removeItem(VIEW_CATEGORY);sessionStorage.removeItem(VIEW_PAYMENT);sessionStorage.removeItem(VIEW_PERSON)}catch{}
location.assign('history.html')}
function openCategoryMonth(category,month){try{sessionStorage.setItem(VIEW_MONTH,activeYear+'-'+String(month).padStart(2,'0'));
sessionStorage.setItem(VIEW_FILTER,kind);sessionStorage.setItem(VIEW_CATEGORY,category);
sessionStorage.removeItem(VIEW_PAYMENT);sessionStorage.removeItem(VIEW_PERSON)}catch{}
location.assign('history.html')}

let tip=null;
function showTip(html,target){if(!tip){tip=document.createElement('div');tip.className='tip';tip.setAttribute('role','presentation');document.body.append(tip)}
tip.innerHTML=html;tip.hidden=false;
const box=target.getBoundingClientRect(),size=tip.getBoundingClientRect();
let left=box.left+box.width/2-size.width/2;
left=Math.max(8,Math.min(left,window.innerWidth-size.width-8));
let top=box.top-size.height-10;
if(top<8)top=box.bottom+10;
tip.style.left=left+'px';tip.style.top=top+'px'}
function hideTip(){if(tip)tip.hidden=true}
window.addEventListener('scroll',hideTip,true);

function render(){$('annual-title').textContent=activeYear+'년 내역';
const rows=combined();
let expense=0,income=0;
const months=Array.from({length:12},()=>({expense:0,income:0}));
const people={person1:{expense:0,income:0},person2:{expense:0,income:0},unspecified:{expense:0,income:0}};
const categories={expense:new Map(),income:new Map()};
const catMonths={expense:new Map(),income:new Map()};
for(const t of rows){const m=Number(t.date.slice(5,7))-1;
if(m>=0&&m<12)months[m][t.type]+=t.amount;
if(t.type==='expense')expense+=t.amount;else income+=t.amount;
people[personKey(t)][t.type]+=t.amount;
const map=categories[t.type];map.set(t.category,(map.get(t.category)||0)+t.amount);
const per=catMonths[t.type];if(!per.has(t.category))per.set(t.category,Array.from({length:12},()=>0));
if(m>=0&&m<12)per.get(t.category)[m]+=t.amount}

$('sum-expense').textContent=won(expense);
$('sum-income').textContent=won(income);
$('sum-net').textContent=won(income-expense);
const activeMonths=months.filter(m=>m.expense||m.income).length;
$('avg-expense').textContent=activeMonths?'내역이 있는 '+activeMonths+'개월 평균 '+won(Math.round(expense/activeMonths)):'';
$('avg-income').textContent=activeMonths?'내역이 있는 '+activeMonths+'개월 평균 '+won(Math.round(income/activeMonths)):'';
$('sum-count').textContent=rows.length+'건';

const peak=months.reduce((best,m,i)=>m.expense>months[best].expense?i:best,0);
const max=Math.max(1,...months.map(m=>Math.max(m.expense,m.income)));
const grid=$('chart-grid');grid.replaceChildren();
for(const ratio of [1,.5,0]){const line=document.createElement('div');
line.style.top=((1-ratio)*100)+'%';
line.textContent=ratio?short(Math.round(max*ratio)):'0';
grid.append(line)}
const chart=$('months');chart.replaceChildren();
const table=$('month-table');table.replaceChildren();
for(let i=0;i<12;i++){const m=months[i],label=(i+1)+'월';
const column=document.createElement('button');column.type='button';column.className='month'+(m.expense&&i===peak?' peak':'');
column.disabled=busy||!ready;
const bars=document.createElement('div');bars.className='month-bars';
for(const type of ['expense','income']){const bar=document.createElement('div');
bar.className='bar '+(m[type]?type:'zero');
bar.style.height=(m[type]?Math.max(2,Math.round(m[type]/max*100)):2)+'%';
bars.append(bar)}
if(m.expense&&i===peak){const tag=document.createElement('span');tag.className='peak-tag';tag.textContent=short(m.expense);bars.append(tag)}
const name=document.createElement('div');name.className='month-label';name.textContent=i+1;
column.append(bars,name);
column.setAttribute('aria-label',activeYear+'년 '+label+' 지출 '+won(m.expense)+', 수입 '+won(m.income)+', 누르면 그 달 내역 보기');
const tipHtml='<b>'+activeYear+'년 '+label+'</b><i class="e"></i>지출 '+won(m.expense)+'<br><i class="i2"></i>수입 '+won(m.income);
column.onmouseenter=()=>showTip(tipHtml,column);
column.onfocus=()=>showTip(tipHtml,column);
column.onmouseleave=hideTip;column.onblur=hideTip;
column.onclick=()=>{if(busy||!ready)return;hideTip();openMonth(i+1)};
chart.append(column);
const tr=document.createElement('tr');
for(const text of [label,m.expense?won(m.expense):'—',m.income?won(m.income):'—',(m.expense||m.income)?won(m.income-m.expense):'—']){const td=document.createElement('td');td.textContent=text;tr.append(td)}
table.append(tr)}

for(const [id,value] of [['cat-expense','expense'],['cat-income','income']])$(id).setAttribute('aria-pressed',String(kind===value));
const entries=[...categories[kind].entries()].sort((a,b)=>b[1]-a[1]);
const total=entries.reduce((s,e)=>s+e[1],0);
const list=$('cats');list.replaceChildren();
for(const [name,amount] of entries){const row=document.createElement('button');row.type='button';row.className='cat';
row.disabled=busy||!ready;
const share=total?amount/total*100:0;
const label=document.createElement('span');label.className='cat-name';label.textContent=name;
const track=document.createElement('span');track.className='cat-track';
const fill=document.createElement('span');fill.className='cat-fill '+kind;
fill.style.width=Math.max(2,Math.round(amount/entries[0][1]*100))+'%';
track.append(fill);
const value=document.createElement('span');value.className='cat-value';
value.append(document.createTextNode(won(amount)));
const percent=document.createElement('small');percent.textContent=share.toFixed(1)+'%';
value.append(percent);
row.append(label,track,value);
const open=expanded===name;
row.setAttribute('aria-expanded',String(open));
row.setAttribute('aria-label',name+' '+(kind==='expense'?'지출':'수입')+' '+won(amount)+', 전체의 '+share.toFixed(1)+'퍼센트, 누르면 월별로 펼치기');
row.onclick=()=>{if(busy||!ready)return;expanded=open?null:name;render()};
list.append(row);
if(!open)continue;
const per=catMonths[kind].get(name)||[];
const strip=document.createElement('div');strip.className='cat-months';
for(let i=0;i<12;i++){if(!per[i])continue;
const chip=document.createElement('button');chip.type='button';chip.className='cat-month';
chip.disabled=busy||!ready;
chip.textContent=(i+1)+'월 '+won(per[i]);
chip.setAttribute('aria-label',activeYear+'년 '+(i+1)+'월 '+name+' '+won(per[i])+', 누르면 그 달 내역 보기');
chip.onclick=event=>{event.stopPropagation();if(busy||!ready)return;openCategoryMonth(name,i+1)};
strip.append(chip)}
list.append(strip)}
$('cats-empty').hidden=entries.length>0;
$('cats-empty').textContent=ready?'이 해에 등록된 '+(kind==='expense'?'지출':'수입')+' 내역이 없습니다.':'내역을 불러온 후 확인할 수 있습니다.';
$('cat-note').hidden=entries.length===0;

const summary=$('people');summary.replaceChildren();
let hasPeople=false;
for(const key of ['person1','person2','unspecified']){const sums=people[key];
if(!sums.expense&&!sums.income)continue;
hasPeople=true;
const item=document.createElement('span');item.className='person-item';item.append(personTag(key));
const text=document.createElement('span');
text.textContent=[sums.expense?'지출 '+won(sums.expense):'',sums.income?'수입 '+won(sums.income):''].filter(Boolean).join(' · ');
item.append(text);summary.append(item)}
$('people-empty').hidden=hasPeople;
controls()}

const actionBar=document.querySelector('header');
function fitActionBar(){document.documentElement.style.setProperty('--bar-h',actionBar.offsetHeight+'px')}
fitActionBar();window.addEventListener('resize',fitActionBar);
if(typeof ResizeObserver!=='undefined')new ResizeObserver(fitActionBar).observe(actionBar);
$('notice').onclick=()=>{clearTimeout(noticeTimer);$('notice').textContent=''};
</script></body></html>
